 var mx=D.querySelector('.wmx'),eq=SEL[c]===i,bt=document.createElement('button');bt.textContent=eq?LX(['Equipado ✓','Equipped ✓']):LX(['Equipar','Equip']);bt.disabled=eq;bt.onclick=function(){SEL[c]=i;gSave();gVis();gRender(c)};mx.appendChild(bt)}
var _wt=wkTab;
wkTab=function(t){['mo','bg','ca','i','m'].forEach(function(k){$('wt-'+k).classList.toggle('on',k===t)});$('wlist').classList.toggle('gl',!!GR[t]);if(GR[t]){WK.tab=t;gRender(t)}else _wt(t)};
['mo','bg','ca'].forEach(function(k){$('wt-'+k).onclick=function(){wkTab(k)}});
function glab(){['mo','bg','ca'].forEach(function(k){$('wt-'+k).textContent=GLg(GN[k])})}
var _al=applyLang;applyLang=function(){_al();glab()};glab();WK.tab='mo';gVis();

/* ---- Salvamento na nuvem (conta Claude) ---- */
var CL={doc:null,st:'init',t:null};
function clTxt(){var en=lang!=='pt',m={on:['☁ Nuvem: ativada','☁ Cloud save: on'],busy:['☁ Sincronizando…','☁ Syncing…'],err:['☁ Falha — toque p/ tentar','☁ Failed — tap to retry'],off:['☁ Entre no Claude p/ salvar','☁ Sign in to Claude to save'],init:['☁ Conectando…','☁ Connecting…']};return LX(m[CL.st])}
function clUI(){var b=$('ocloud');if(b)b.textContent=clTxt()}
function clSnap(){return {best:best,st:ST,sel:SEL,unl:UNL,cfg:CFG,lang:lang,t:Date.now()}}
function clLocal(){try{localStorage.setItem('us_best',best);localStorage.setItem('us_st',JSON.stringify(ST));localStorage.setItem('us_gar',JSON.stringify(SEL));localStorage.setItem('us_unl',JSON.stringify(UNL));localStorage.setItem('us_cfg',JSON.stringify(CFG));localStorage.setItem('us_lang',lang)}catch(e){}}
function clPush(){if(!CL.doc)return;clearTimeout(CL.t);CL.t=setTimeout(function(){CL.st='busy';clUI();CL.doc.set(clSnap()).then(function(){CL.st='on';clUI()}).catch(function(){CL.st='err';clUI()})},1500)}
function clMerge(d){
 if(+d.best>best)best=+d.best;
 if(d.st)for(var k in ST)if(+d.st[k]>ST[k])ST[k]=+d.st[k];
 if(d.unl)for(var k in d.unl)if(d.unl[k])UNL[k]=1;
 if(d.sel)for(var k in SEL)if(+d.sel[k]>=0&&+d.sel[k]<7)SEL[k]=+d.sel[k];
 for(var k in GS)GS[k]=SEL[k];
 if(d.cfg){if(d.cfg.vib!==undefined)CFG.vib=d.cfg.vib;if(d.cfg.map!==undefined)CFG.map=d.cfg.map;if(d.cfg.snd!==undefined)CFG.snd=d.cfg.snd}
 var hl=null;try{hl=localStorage.getItem('us_lang')}catch(e){}if(!hl&&LANGS.some(function(l){return l.id===d.lang}))lang=d.lang;
 clLocal();
}
function clInit(){
 var cl=window.claude;if(!cl||!cl.use){CL.st='off';clUI();return}
 Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
  var db=r[0],us=r[1];if(!db||!us){CL.st='off';clUI();return}
  return us.id().then(function(id){
   if(!id){CL.st='off';clUI();return}
   CL.doc=db.doc('data/users/'+id+'/save');LB.id=id;LB.col=db.collection('leaderboard');LB.ref=db.doc('leaderboard/'+id);LB.us=us;if(best>0)lbPush();
   return CL.doc.get().then(function(snap){
    if(snap.exists)clMerge(snap.data());
    CL.st='on';applyLang();clUI();clPush();
   })
  })
 }).catch(function(){CL.st='off';clUI()});
}
var _al=applyLang;applyLang=function(){_al();clUI()};
$('ocloud').onclick=function(){if(CL.doc){clearTimeout(CL.t);CL.t=null;CL.st='busy';clUI();CL.doc.set(clSnap()).then(function(){CL.st='on';clUI()}).catch(function(){CL.st='err';clUI()})}else if(CL.st!=='init'){CL.st='init';clUI();clInit()}};
var _gs=gSave;gSave=function(){_gs();clPush()};
var _sc=svCfg;svCfg=function(){_sc();clPush()};
clUI();clInit();

/* ---- Ranking global ---- */
var LB={id:null,col:null,ref:null,us:null};
function lbPush(){if(!LB.ref)return;LB.ref.set({score:best,lv:S?S.lv:(ST.lv||0),kills:S?S.kills:0,map:MAPI,t:Date.now()}).catch(function(){})}
function rkLang(){$('rkbt').textContent=LX(['Ranking','Ranking']);$('rkbs').textContent=LX(['Melhores pontua\u00e7\u00f5es do mundo','World\u2019s best scores']);var h=$('h-rank');if(h)h.textContent=LX(['Ranking','Ranking']);$('rkback').textContent=TX('back');$('omenu').textContent=LX(['\u2190 Menu','\u2190 Menu'])}
var _alr=applyLang;applyLang=function(){_alr();rkLang()};rkLang();
function rkFmt(sc){var m=Math.floor(sc/60),s=sc%60;return m+':'+(s<10?'0':'')+s}
function rkRow(pos,name,avatar,sc,isme){var r=document.createElement('div');r.className='rkrow'+(isme?' me':'');
 var p=document.createElement('span');p.className='rkp';p.textContent=pos+'.';r.appendChild(p);
 var im=document.createElement('img');im.src=avatar;im.alt='';r.appendChild(im);
 var n=document.createElement('span');n.className='rkn';n.textContent=name||LX(['Jogador','Player']);r.appendChild(n);
 var s=document.createElement('span');s.className='rks';s.textContent=rkFmt(sc);r.appendChild(s);
 return r}
function rkLoad(){var L=$('rklist');
 if(!LB.col){L.innerHTML='';var m=document.createElement('div');m.id='rkmsg';m.textContent=LX(['Entre no Claude para ver o ranking mundial.','Sign in to Claude to see the world ranking.']);L.appendChild(m);return}
 L.innerHTML='';var ld=document.createElement('div');ld.id='rkmsg';ld.textContent=LX(['Carregando\u2026','Loading\u2026']);L.appendChild(ld);
 LB.col.orderBy('score','desc').limit(10).get().then(function(qs){
  var ids=qs.docs.map(function(d){return d.id});
  var pf=(LB.us&&ids.length)?LB.us.profiles(ids):Promise.resolve({});
  return Promise.resolve(pf).then(function(ps){
   L.innerHTML='';
   if(!qs.docs.length){var e=document.createElement('div');e.id='rkmsg';e.textContent=LX(['Ningu\u00e9m no ranking ainda. Seja o primeiro!','Nobody on the board yet. Be the first!']);L.appendChild(e);return}
   qs.docs.forEach(function(d,i){var dt=d.data(),pr=(ps&&ps[d.id])||{},isme=d.id===LB.id;
    L.appendChild(rkRow(i+1,pr.name,pr.avatarUrl||'',dt.score||0,isme))
   });
  })
 }).catch(function(){L.innerHTML='';var e=document.createElement('div');e.id='rkmsg';e.textContent=LX(['N\u00e3o foi poss\u00edvel carregar o ranking.','Could not load the ranking.']);L.appendChild(e)})
}
$('rkb').onclick=function(){page('rank')};
$('rkback').onclick=function(){page('menu')};

})();
