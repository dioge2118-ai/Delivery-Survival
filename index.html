var MDT={"z": {"es": "El no-muerto más común. Camina despacio, siempre en horda, y la horda solo crece con el tiempo. Cada zombi tiene su propio peinado y color de pelo, y suelta un \"HUUUMM\" arrastrado.", "fr": "Le mort-vivant le plus courant. Il marche lentement, toujours en horde, et la horde ne fait que grossir avec le temps. Chaque zombie a sa coiffure et sa couleur de cheveux, et pousse un « HUUUMM » traînant.", "de": "Der häufigste Untote. Er geht langsam, immer in einer Horde, und die Horde wächst mit der Zeit nur weiter. Jeder Zombie hat eine eigene Frisur und Haarfarbe und stößt ein gedehntes „HUUUMM“ aus.", "it": "Il non morto più comune. Cammina lento, sempre in orda, e l'orda cresce solo con il tempo. Ogni zombie ha un'acconciatura e un colore di capelli diversi e emette un \"HUUUMM\" strascicato.", "ja": "最も一般的なアンデッド。ゆっくり歩き、必ず群れで現れ、群れは時間とともに増える一方。ゾンビごとに髪型と髪色が違い、「ウウウーン」と間延びしたうめき声を上げる。", "ko": "가장 흔한 언데드. 느리게 걷고 항상 무리를 지으며, 무리는 시간이 갈수록 계속 커집니다. 좀비마다 헤어스타일과 머리색이 다르고 \"으으으음\" 하고 길게 신음합니다.", "zh": "最常见的亡灵。行动缓慢,总是成群结队,而且尸群会随时间不断壮大。每只僵尸的发型和发色都不一样,还会发出拖长的“呜呜嗯”声。", "ru": "Самая распространённая нежить. Ходит медленно, всегда ордой, а орда со временем только растёт. У каждого зомби своя причёска и цвет волос, и он протяжно стонет: «УУУММ».", "tr": "En yaygın ölümsüz. Yavaş yürür, hep sürü halinde gelir ve sürü zamanla büyümeye devam eder. Her zombinin saç stili ve saç rengi farklıdır; uzun uzun \"HUUUMM\" diye inler."}, "r": {"es": "Diminuta, rapidísima y nunca sola: siempre en trío. Escapó de las alcantarillas siguiendo las sobras de los pedidos. Débil, pero muy molesta cuando rodea tu moto.", "fr": "Minuscule, ultra rapide et jamais seul : toujours en trio. Il a fui les égouts à la poursuite des restes de commandes. Faible, mais vraiment agaçant quand il encercle votre moto.", "de": "Winzig, superschnell und nie allein: immer zu dritt. Sie ist aus der Kanalisation geflohen, den Resten der Bestellungen hinterher. Schwach, aber richtig nervig, wenn sie dein Motorrad umzingelt.", "it": "Minuscolo, velocissimo e mai da solo: sempre in tre. È scappato dalle fogne inseguendo gli avanzi degli ordini. Debole, ma davvero fastidioso quando circonda la tua moto.", "ja": "小さくて超高速、しかも必ず3匹で行動する。下水道から注文の残り物を追って逃げ出してきた。弱いが、バイクを囲まれるととにかく厄介。", "ko": "작고 엄청나게 빠르며 절대 혼자 다니지 않고 항상 세 마리가 함께 옵니다. 주문 음식 찌꺼기를 쫓아 하수구를 탈출했죠. 약하지만 바이크를 둘러싸면 정말 귀찮습니다.", "zh": "体型很小、速度极快,从不单独行动,总是三只一组。它们为了追逐剩下的外卖订单而逃出下水道。虽然弱小,但把你的摩托围起来时非常烦人。", "ru": "Крошечная, сверхбыстрая и никогда не одна: всегда втроём. Сбежала из канализации в погоне за остатками заказов. Слабая, но очень досаждает, когда окружает твой байк.", "tr": "Minik, süper hızlı ve asla yalnız değil: hep üçlü gelir. Siparişlerin artıklarını kovalayarak kanalizasyondan kaçtı. Zayıf ama motosikletini sardığında gerçekten can sıkıcı."}, "v": {"es": "Frágil pero muy rápido. Corre directo hacia ti con capa roja y ojos brillantes, y suelta un siseo agudo. Es fácil de matar, pero llega antes de que puedas reaccionar.", "fr": "Fragile mais très rapide. Il fonce droit sur vous en cape rouge, les yeux brillants, avec un sifflement aigu. Facile à tuer, mais il vous atteint avant que vous ayez le temps de réagir.", "de": "Zerbrechlich, aber sehr schnell. Er rennt in rotem Umhang und mit leuchtenden Augen direkt auf dich zu und zischt schrill. Leicht zu töten, aber er erreicht dich, bevor du reagieren kannst.", "it": "Fragile ma velocissimo. Ti corre incontro con un mantello rosso e gli occhi luminosi, emettendo un sibilo acuto. Facile da uccidere, ma ti raggiunge prima che tu possa reagire.", "ja": "もろいがとても速い。赤いマントをなびかせ、目を光らせてまっすぐ突っ込み、鋭い声でシューと鳴く。倒すのは簡単だが、反応する前に距離を詰めてくる。", "ko": "약하지만 매우 빠릅니다. 붉은 망토를 두르고 눈을 번뜩이며 곧장 달려들어 날카로운 쉭 소리를 냅니다. 쉽게 쓰러지지만 반응하기도 전에 다가옵니다.", "zh": "脆弱但速度极快。披着红色斗篷、双眼发光,径直冲向你,并发出尖锐的嘶声。很容易消灭,但你还没反应过来它就到了。", "ru": "Хрупкий, но очень быстрый. В красном плаще и со светящимися глазами несётся прямо на тебя и пронзительно шипит. Убить легко, но он добирается до тебя раньше, чем ты успеешь среагировать.", "tr": "Kırılgan ama çok hızlı. Kırmızı pelerini ve parlayan gözleriyle doğrudan üstüne koşar ve keskin bir tıslama çıkarır. Öldürmesi kolay ama sen tepki veremeden yanına varır."}, "g": {"es": "Un repartidor que nunca terminó su última ruta. Flota en zigzag, con gorra roja y aún cargando la caja del pedido. Sus ojos brillan en azul.", "fr": "Un livreur qui n'a jamais terminé sa dernière tournée. Il flotte en zigzag, coiffé d'une casquette rouge, la boîte de commande toujours à la main. Ses yeux brillent en bleu.", "de": "Ein Lieferant, der seine letzte Route nie beendet hat. Er schwebt im Zickzack, trägt eine rote Mütze und hat immer noch die Bestellbox dabei. Seine Augen leuchten blau.", "it": "Un fattorino che non ha mai finito l'ultimo giro. Fluttua a zigzag, con un cappellino rosso e ancora con la scatola dell'ordine. I suoi occhi brillano di blu.", "ja": "最後の配達ルートを終えられなかった配達員。赤いキャップをかぶり、注文の箱を抱えたまま、ジグザグに宙を漂う。目は青く光っている。", "ko": "마지막 배달 경로를 끝내지 못한 배달원입니다. 빨간 모자를 쓰고 주문 상자를 든 채 지그재그로 떠다니며, 눈은 파랗게 빛납니다.", "zh": "一名没能跑完最后一单的外卖员。戴着红色鸭舌帽,仍抱着订单箱,呈之字形飘动,双眼泛着蓝光。", "ru": "Курьер, так и не закончивший последний маршрут. Парит зигзагами в красной кепке и всё ещё несёт коробку с заказом. Глаза светятся синим.", "tr": "Son rotasını hiç bitiremeyen bir kurye. Kırmızı şapkasıyla, hâlâ sipariş kutusunu taşıyarak zikzak çizerek süzülür. Gözleri mavi parlar."}, "p": {"es": "Lento, pero resistente y de golpe fuerte. Deja un rastro de dinero por donde pasa y hace \"ronk, ronk\" seguido de un hipo.", "fr": "Lent, mais coriace et frappant fort. Il laisse une traînée d'argent sur son passage et fait « ronk, ronk » suivi d'un hoquet.", "de": "Langsam, aber zäh und schlagkräftig. Es hinterlässt eine Geldspur und macht „ronk, ronk“, gefolgt von einem Schluckauf.", "it": "Lento, ma resistente e dai colpi pesanti. Lascia una scia di soldi ovunque passi e fa \"ronk, ronk\" seguito da un singhiozzo.", "ja": "動きは遅いが頑丈で一撃が重い。歩いた跡にお金をばらまき、「ブヒ、ブヒ」と鳴いたあとにしゃっくりをする。", "ko": "느리지만 튼튼하고 강하게 때립니다. 지나간 자리에 돈을 흘리고 \"꿀꿀\" 하다가 딸꾹질을 합니다.", "zh": "动作缓慢,但皮糙肉厚、攻击很重。走过的地方会留下一路钞票,发出“哼哼”声,接着还会打个嗝。", "ru": "Медленный, но крепкий и сильно бьёт. Оставляет за собой дорожку денег и хрюкает «хрю, хрю», а потом икает.", "tr": "Yavaş ama sağlam ve sert vurur. Yürüdüğü yere para izi bırakır, \"ronk, ronk\" diye homurdanır ve ardından hıçkırır."}, "w": {"es": "Aún lleva los restos de una camisa de repartidor. Camina despacio, pero cuando sus ojos se vuelven rojos se frena, junta fuerzas y se lanza en línea recta a toda velocidad.", "fr": "Il porte encore les lambeaux d'une chemise de livreur. Il marche lentement, mais quand ses yeux deviennent rouges, il ralentit, rassemble ses forces et fonce en ligne droite à toute vitesse.", "de": "Er trägt noch die Fetzen eines Lieferanten-Hemds. Er geht langsam, doch wenn seine Augen rot werden, bremst er ab, sammelt Kraft und springt in einer sehr schnellen geraden Linie los.", "it": "Indossa ancora i resti di una camicia da fattorino. Cammina lento, ma quando gli occhi diventano rossi rallenta, raccoglie le forze e scatta in linea retta velocissimo.", "ja": "配達員のシャツの切れ端をまだ身にまとっている。ゆっくり歩くが、目が赤くなると動きを止めて力を溜め、一直線に猛スピードで飛びかかる。", "ko": "아직도 배달 셔츠 조각을 걸치고 있습니다. 느리게 걷지만 눈이 붉어지면 속도를 늦추고 힘을 모았다가 매우 빠르게 일직선으로 덮칩니다.", "zh": "身上还挂着外卖员衬衫的碎片。平时走得很慢,但双眼变红时会先减速蓄力,然后沿直线飞速扑来。", "ru": "На нём всё ещё лохмотья курьерской рубашки. Ходит медленно, но когда глаза краснеют, замедляется, копит силы и прыгает по прямой с огромной скоростью.", "tr": "Üzerinde hâlâ bir kurye gömleğinin parçaları var. Yavaş yürür ama gözleri kızarınca yavaşlar, güç toplar ve çok hızlı bir şekilde düz bir çizgide atılır."}, "q": {"es": "Piedra viva que bajó de los edificios de la ciudad. Lenta y muy resistente. Por debajo de la mitad de vida se enfurece: sus ojos se ponen rojos, bate las alas rápido y vuela tras de ti.", "fr": "Pierre vivante descendue des immeubles de la ville. Lente et très coriace. Sous la moitié de sa vie, elle s'enrage : ses yeux deviennent rouges, ses ailes battent vite et elle vous poursuit en vol.", "de": "Lebendiger Stein, der von den Gebäuden der Stadt herabgestiegen ist. Langsam und sehr zäh. Unter der Hälfte seiner Leben gerät er in Rage: Die Augen werden rot, die Flügel schlagen schnell und er fliegt dir nach.", "it": "Pietra vivente scesa dagli edifici della città. Lenta e molto resistente. Sotto metà salute si infuria: gli occhi diventano rossi, le ali battono veloci e ti insegue in volo.", "ja": "街のビルから降りてきた生きた石像。動きは遅く非常に頑丈。体力が半分を切ると激昂し、目が赤くなり、翼を激しく羽ばたかせて飛んで追ってくる。", "ko": "도시 건물에서 내려온 살아 있는 돌입니다. 느리고 매우 튼튼합니다. 체력이 절반 아래로 떨어지면 분노해 눈이 붉어지고 날개를 빠르게 퍼덕이며 날아서 쫓아옵니다.", "zh": "从城市建筑上下来的活石像。行动缓慢、非常坚固。生命低于一半时会暴怒:双眼变红、翅膀急速拍动,飞起来追击你。", "ru": "Живой камень, спустившийся со зданий города. Медленный и очень прочный. Когда здоровья остаётся меньше половины, он впадает в ярость: глаза краснеют, крылья быстро машут, и он летит за тобой.", "tr": "Şehir binalarından inen yaşayan taş. Yavaş ve çok sağlam. Canı yarının altına düşünce öfkelenir: gözleri kızarır, kanatları hızla çırpılır ve seni uçarak kovalar."}, "m1": {"es": "Salió de la arena con las pinzas en alto y avanza arrastrando los pies como un buen zombi. Sus ojos sobre tallos nunca pierden de vista tu moto.", "fr": "Sorti du sable, pinces levées, il avance en traînant les pattes comme un vrai zombie. Ses yeux sur tiges ne quittent jamais votre moto.", "de": "Er ist mit erhobenen Scheren aus dem Sand gekrochen und schlurft wie ein echter Zombie vorwärts. Seine Stielaugen verlieren dein Motorrad nie aus dem Blick.", "it": "È uscito dalla sabbia con le chele alzate e avanza barcollando come un vero zombie. I suoi occhi sugli steli non perdono mai di vista la tua moto.", "ja": "ハサミを掲げて砂の中から這い出し、本物のゾンビのようによろよろと進む。柄の先の目は決してバイクを見失わない。", "ko": "집게발을 치켜든 채 모래에서 기어 나와 진짜 좀비처럼 비틀비틀 걸어옵니다. 눈자루는 바이크에서 절대 눈을 떼지 않습니다.", "zh": "举着蟹钳从沙里爬出来,像真正的僵尸一样蹒跚前进。它的柄眼始终盯着你的摩托。", "ru": "Выполз из песка с поднятыми клешнями и бредёт вперёд, как настоящий зомби. Его глаза на стебельках ни на секунду не теряют твой байк из виду.", "tr": "Kıskaçları havada kumdan çıktı ve gerçek bir zombi gibi sürüne sürüne ilerliyor. Sapların ucundaki gözleri motosikletini asla gözden kaçırmaz."}, "m2": {"es": "Un nadador al que electrocutó una medusa y nunca volvió a ser el mismo. Cabeza rosada y gelatinosa, tentáculos que se balancean y un andar tambaleante.", "fr": "Un nageur piqué par une méduse qui n'a plus jamais été le même. Tête gélatineuse rose, tentacules ondulants et démarche chancelante.", "de": "Ein Schwimmer, der von einer Qualle gestochen wurde und nie wieder derselbe war. Rosa, gallertartiger Kopf, schwankende Tentakel und ein wackeliger Gang.", "it": "Un nuotatore colpito da una medusa che non è più stato lo stesso. Testa gelatinosa rosa, tentacoli ondeggianti e andatura barcollante.", "ja": "クラゲに刺されてから別人になってしまった泳ぎ手。ピンク色のゼリー状の頭、揺れる触手、ふらふらした足取り。", "ko": "해파리에게 쏘인 뒤 예전 모습을 잃은 수영객입니다. 분홍빛 젤리 같은 머리, 흔들리는 촉수, 비틀거리는 걸음걸이를 가졌습니다.", "zh": "被水母电到后就再也不正常的游泳者。粉色的胶质脑袋、摇摆的触手和摇晃的步伐。", "ru": "Пловец, которого ужалила медуза, и с тех пор он уже не тот. Розовая студенистая голова, покачивающиеся щупальца и шаткая походка.", "tr": "Denizanası çarpması sonrası bir daha eskisi gibi olmayan bir yüzücü. Pembe, jelatinimsi kafa, sallanan dokunaçlar ve tökezleyen bir yürüyüş."}, "m3": {"es": "Cambió el mar por la acera. Con una aleta en la cabeza y los dientes a la vista, es más resistente y muerde más fuerte que el zombi común.", "fr": "Il a troqué la mer contre le trottoir. Avec un aileron sur la tête et les dents apparentes, il est plus coriace et mord plus fort que le zombie ordinaire.", "de": "Hat das Meer gegen den Bürgersteig getauscht. Mit einer Flosse auf dem Kopf und gebleckten Zähnen ist er zäher und beißt härter als der gewöhnliche Zombie.", "it": "Ha scambiato il mare con il marciapiede. Con una pinna sulla testa e i denti in mostra, è più resistente e morde più forte dello zombie comune.", "ja": "海を捨てて歩道に上がってきた。頭にヒレ、むき出しの歯を持ち、普通のゾンビより頑丈で噛む力も強い。", "ko": "바다를 떠나 인도로 올라왔습니다. 머리에 지느러미가 있고 이빨을 드러낸 채, 일반 좀비보다 튼튼하고 더 세게 뭅니다.", "zh": "离开大海来到了人行道。头顶背鳍、露出利齿,比普通僵尸更坚硬,咬得也更狠。", "ru": "Променял море на тротуар. С плавником на голове и оскаленными зубами он крепче обычного зомби и кусается сильнее.", "tr": "Denizi kaldırımla değiştirdi. Başında yüzgeç, dişleri dışarıda; sıradan zombiden daha dayanıklı ve daha sert ısırır."}, "m4": {"es": "Pasó tanto tiempo en el fondo del mar que acabó siendo parte de él. Pelo de algas goteante, piel azul verdosa y un paso arrastrado.", "fr": "Il a passé tant de temps au fond de la mer qu'il en fait désormais partie. Cheveux d'algues dégoulinants, peau bleu-vert et pas traînant.", "de": "Er hat so lange auf dem Meeresgrund verbracht, dass er ein Teil davon wurde. Triefendes Algenhaar, blaugrüne Haut und ein schleppender Schritt.", "it": "Ha passato così tanto tempo sul fondale che ne è diventato parte. Capelli di alghe gocciolanti, pelle blu-verde e passo strascicato.", "ja": "海底に長くいすぎて、海の一部になってしまった。海藻の髪から水を滴らせ、青緑色の肌で足を引きずって歩く。", "ko": "바다 밑바닥에 너무 오래 있어서 바다의 일부가 되었습니다. 물이 뚝뚝 떨어지는 해초 머리, 청록색 피부, 질질 끄는 걸음걸이를 가졌습니다.", "zh": "在海底待得太久,已经和大海融为一体。海藻般滴水的头发、蓝绿色的皮肤,拖着步子前行。", "ru": "Так долго пробыл на морском дне, что стал его частью. Мокрые водорослевые волосы, сине-зелёная кожа и волочащаяся походка.", "tr": "Deniz dibinde o kadar uzun kaldı ki onun bir parçası oldu. Su damlayan yosun saçları, mavi-yeşil teni ve sürüyen adımları var."}, "m5": {"es": "Cabeza morada grande, ojos enormes y tentáculos que se balancean a los lados. El más lento del grupo, pero aguanta muchos golpes.", "fr": "Grosse tête violette, yeux énormes et tentacules qui balancent sur les côtés. Le plus lent de la bande, mais il encaisse énormément de coups.", "de": "Großer lila Kopf, riesige Augen und seitlich schwingende Tentakel. Der Langsamste der Gruppe, aber er hält viele Treffer aus.", "it": "Grande testa viola, occhi enormi e tentacoli che dondolano ai lati. Il più lento del gruppo, ma resiste a molti colpi.", "ja": "大きな紫色の頭、巨大な目、両脇で揺れる触手。仲間の中で最も遅いが、たくさんの攻撃に耐える。", "ko": "커다란 보라색 머리, 거대한 눈, 양옆에서 흔들리는 촉수를 가졌습니다. 무리 중 가장 느리지만 많은 공격을 버팁니다.", "zh": "巨大的紫色脑袋、硕大的眼睛,触手在两侧摇摆。这群里最慢的,但非常耐打。", "ru": "Большая фиолетовая голова, огромные глаза и щупальца, раскачивающиеся по бокам. Самый медленный из всей компании, но выдерживает много ударов.", "tr": "Büyük mor kafa, kocaman gözler ve yanlarda sallanan dokunaçlar. Grubun en yavaşı ama çok darbe dayanır."}, "b": {"es": "El primer jefe. Cada minuto aparece un jefe, por turnos, siempre con más vida que el anterior. Casi no se mueve con el empuje y bocina. Al caer suelta gemas y un maletín con mejoras de rareza variable.", "fr": "Le premier boss. Un boss apparaît chaque minute, à tour de rôle, toujours avec plus de vie que le précédent. Le recul le déplace à peine et il klaxonne. En tombant, il laisse des gemmes et une mallette d'améliorations de raretés variées.", "de": "Der erste Boss. Jede Minute erscheint ein Boss, abwechselnd, immer mit mehr Leben als der vorherige. Rückstoß bewegt ihn kaum, und er hupt. Wenn er fällt, lässt er Edelsteine und einen Aktenkoffer mit Upgrades unterschiedlicher Seltenheit fallen.", "it": "Il primo boss. Ogni minuto compare un boss, a turno, sempre con più salute del precedente. Il contraccolpo lo sposta a malapena e suona il clacson. Quando cade lascia gemme e una valigetta con potenziamenti di rarità varia.", "ja": "最初のボス。ボスは1分ごとに順番に現れ、毎回前よりも体力が増える。ノックバックでほとんど動かず、クラクションを鳴らす。倒すとジェムと、レア度がさまざまな強化入りのブリーフケースを落とす。", "ko": "첫 번째 보스입니다. 보스는 1분마다 번갈아 등장하며 항상 이전보다 체력이 많습니다. 밀쳐내기로는 거의 움직이지 않고 경적을 울립니다. 쓰러지면 보석과 다양한 희귀도의 강화가 든 서류가방을 떨어뜨립니다.", "zh": "第一个头目。每分钟会轮流出现一个头目,生命值总比上一个更高。几乎不会被击退,还会鸣笛。倒下时会掉落宝石和一个装有各种稀有度升级的公文包。", "ru": "Первый босс. Каждую минуту по очереди появляется босс, всегда с большим здоровьем, чем предыдущий. Отбрасывание почти не сдвигает его, и он гудит. Падая, он роняет кристаллы и портфель с улучшениями разной редкости.", "tr": "İlk patron. Her dakika sırayla bir patron çıkar ve her biri öncekinden daha fazla cana sahiptir. Geri itmeyle neredeyse yerinden oynamaz ve korna çalar. Düşünce mücevherler ve farklı nadirlikte geliştirmeler içeren bir evrak çantası bırakır."}, "bs": {"es": "Un gólem de poste y semáforo con muy mala pinta. Verde: carga a gran velocidad. Amarillo: reduce la marcha, es un aviso. Rojo: se detiene en seco y levanta una señal de STOP. Aprovecha el rojo para correr y atacar a distancia.", "fr": "Un golem de poteau et de feu de signalisation à l'air mauvais. Vert : il charge à grande vitesse. Orange : il ralentit, c'est un avertissement. Rouge : il s'arrête net et lève un panneau STOP. Profitez du rouge pour fuir et attaquer à distance.", "de": "Ein Golem aus Mast und Ampel mit fiesem Blick. Grün: Er stürmt mit hoher Geschwindigkeit los. Gelb: Er wird langsamer, eine Warnung. Rot: Er bleibt abrupt stehen und hebt ein STOPP-Schild. Nutze Rot, um wegzulaufen und aus der Ferne anzugreifen.", "it": "Un golem di palo e semaforo dall'aspetto minaccioso. Verde: carica ad alta velocità. Giallo: rallenta, è un avvertimento. Rosso: si ferma di colpo e alza un segnale di STOP. Sfrutta il rosso per scappare e attaccare da lontano.", "ja": "柱と信号機でできた、不気味な顔のゴーレム。青:高速で突進。黄:減速する、警告のサイン。赤:ぴたりと止まりSTOP標識を掲げる。赤の間に逃げて、遠くから攻撃しよう。", "ko": "기둥과 신호등으로 된, 험악하게 생긴 골렘입니다. 초록: 빠르게 돌진합니다. 노랑: 속도를 줄이며 경고합니다. 빨강: 딱 멈추고 STOP 표지판을 듭니다. 빨간불일 때 도망치며 원거리에서 공격하세요.", "zh": "由灯杆和信号灯组成的傀儡,面相凶恶。绿灯:高速冲锋。黄灯:减速,作为警告。红灯:急停并举起 STOP 标志。趁红灯拉开距离,远程攻击。", "ru": "Голем из столба и светофора с недобрым видом. Зелёный: несётся на большой скорости. Жёлтый: замедляется — предупреждение. Красный: резко останавливается и поднимает знак STOP. Используй красный, чтобы убежать и атаковать издалека.", "tr": "Sert görünüşlü, direk ve trafik ışığından oluşan bir golem. Yeşil: yüksek hızla hücum eder. Sarı: yavaşlar, bir uyarıdır. Kırmızı: apansız durur ve DUR levhasını kaldırır. Kırmızıda kaç ve uzaktan saldır."}, "bc": {"es": "Un perro gigante de tres cabezas con collar de pinchos. Merodea despacio, sus ojos se ponen rojos y se lanza en línea recta. Esquiva hacia un lado cuando cargue.", "fr": "Un chien géant à trois têtes avec un collier à pointes. Il rôde lentement, ses yeux deviennent rouges et il fonce en ligne droite. Esquivez sur le côté quand il charge.", "de": "Ein riesiger dreiköpfiger Köter mit Stachelhalsband. Er schleicht langsam umher, seine Augen werden rot und er springt in gerader Linie los. Weiche zur Seite aus, wenn er angreift.", "it": "Un gigantesco cane a tre teste con un collare a punte. Si aggira lento, gli occhi diventano rossi e scatta in linea retta. Schivalo di lato quando carica.", "ja": "スパイク付きの首輪をした三つ首の巨大な犬。ゆっくりうろつき、目が赤くなると一直線に飛びかかる。突進してきたら横にかわそう。", "ko": "가시 목걸이를 찬 머리 셋 달린 거대한 개입니다. 느릿느릿 어슬렁거리다가 눈이 붉어지면 일직선으로 덮칩니다. 돌진할 때는 옆으로 피하세요.", "zh": "戴着尖刺项圈的三头巨犬。缓慢徘徊,双眼变红后沿直线扑来。它冲锋时向侧面闪避。", "ru": "Гигантская трёхголовая дворняга в ошейнике с шипами. Медленно бродит, глаза краснеют, и она бросается по прямой. Уворачивайся в сторону, когда она несётся.", "tr": "Dikenli tasmalı, üç başlı dev bir sokak köpeği. Yavaşça dolaşır, gözleri kızarır ve düz bir çizgide atılır. Hücum edince yana kaç."}, "bk": {"es": "Lento, enorme y muy resistente. Echa humo y, de vez en cuando, abre su tolva y suelta tres ratas de alcantarilla detrás. Elimina rápido a las ratas para no quedar rodeado.", "fr": "Lent, énorme et très coriace. Il crache de la fumée et, de temps en temps, ouvre sa trémie et déverse trois rats d'égout derrière lui. Éliminez vite les rats pour ne pas être encerclé.", "de": "Langsam, riesig und sehr zäh. Er stößt Rauch aus und öffnet hin und wieder seine Mulde, um drei Kanalratten hinter sich auszukippen. Erledige die Ratten schnell, damit du nicht umzingelt wirst.", "it": "Lento, enorme e molto resistente. Sbuffa fumo e, ogni tanto, apre la tramoggia e scarica tre ratti di fogna dietro di sé. Elimina in fretta i ratti per non farti circondare.", "ja": "動きは遅く、巨大で非常に頑丈。煙を吐き、ときどき投入口を開いて背後に下水道ネズミを3匹ばらまく。囲まれないよう、ネズミはすばやく片付けよう。", "ko": "느리고 거대하며 매우 튼튼합니다. 연기를 내뿜다가 가끔 투입구를 열어 뒤쪽에 하수구 쥐 세 마리를 쏟아냅니다. 포위당하지 않게 쥐를 빨리 처리하세요.", "zh": "缓慢、巨大且极其坚固。会喷出黑烟,时不时打开料斗,在身后倒出三只下水道老鼠。尽快清掉老鼠,以免被包围。", "ru": "Медленный, огромный и очень прочный. Пускает дым и время от времени открывает кузов, вываливая позади себя трёх канализационных крыс. Быстро убирай крыс, чтобы тебя не окружили.", "tr": "Yavaş, devasa ve çok sağlam. Duman çıkarır ve ara sıra haznesini açıp arkasına üç kanalizasyon faresi boşaltır. Çevrilmemek için fareleri çabucak temizle."}, "bp": {"es": "Una paloma gigante con una mochila de reparto robada. Vuela en picados: acelera mucho y luego casi se detiene, balanceándose de lado a lado. Difícil de golpear, pero con poca vida.", "fr": "Un pigeon géant portant un sac à dos de livraison volé. Il vole en piqués : il accélère fortement, puis s'arrête presque, en se balançant d'un côté à l'autre. Difficile à toucher, mais peu de vie.", "de": "Eine riesige Taube mit einem gestohlenen Lieferrucksack. Sie fliegt in Sturzflügen: Sie beschleunigt stark, bremst dann fast ab und schwankt hin und her. Schwer zu treffen, aber wenig Leben.", "it": "Un piccione gigante con uno zaino da consegne rubato. Vola a planate: accelera molto, poi quasi si ferma, oscillando da un lato all'altro. Difficile da colpire, ma con poca salute.", "ja": "盗んだ配達用リュックを背負った巨大なハト。急降下するように飛び、一気に加速したあとほぼ停止し、左右に揺れる。当てにくいが体力は低い。", "ko": "훔친 배달 배낭을 멘 거대한 비둘기입니다. 급강하하듯 날며 크게 가속했다가 거의 멈추고 좌우로 흔들립니다. 맞히기 어렵지만 체력은 낮습니다.", "zh": "背着偷来的外卖背包的巨型鸽子。以俯冲方式飞行:先猛然加速,再几乎停住,左右摇摆。很难命中,但生命值不高。", "ru": "Гигантский голубь с украденным курьерским рюкзаком. Летает рывками: сильно разгоняется, потом почти останавливается, покачиваясь из стороны в сторону. В него трудно попасть, но здоровья у него мало.", "tr": "Çalıntı bir kurye sırt çantası taşıyan dev bir güvercin. Dalışlarla uçar: çok hızlanır, sonra neredeyse durur ve iki yana sallanır. Vurması zor ama canı az."}};
function MDx(m){if(lang==='pt'||lang==='en')return LX(m.d);var t=MDT[m.id];return t&&t[lang]?t[lang]:LX(m.d)}
(function(N,M){var LG=["es", "fr", "de", "it", "ja", "ko", "zh", "ru", "tr"];for(var k in N){var v=N[k].split('¦');LG.forEach(function(l,i){D18[l][k]=v[i]})}for(var k in M){var v=M[k].split('¦');MDT[k]={};LG.forEach(function(l,i){MDT[k][l]=v[i]})}})({"Hardhat zombie": "Zombi con casco de obra¦Zombie casqué de chantier¦Bauhelm-Zombie¦Zombie con elmetto¦ヘルメットゾンビ¦안전모 좀비¦安全帽僵尸¦Зомби в каске¦Baret zombisi", "Box-head zombie": "Zombi cabeza de caja¦Zombie tête de carton¦Karton-Zombie¦Zombie testa di scatola¦箱頭ゾンビ¦박스 머리 좀비¦纸箱头僵尸¦Зомби-коробка¦Kutu kafa zombi", "Welder zombie": "Zombi soldador¦Zombie soudeur¦Schweißer-Zombie¦Zombie saldatore¦溶接ゾンビ¦용접공 좀비¦焊工僵尸¦Зомби-сварщик¦Kaynakçı zombi", "Tape mummy": "Momia de cinta¦Momie de scotch¦Klebeband-Mumie¦Mummia di nastro¦テープのミイラ¦테이프 미라¦胶带木乃伊¦Мумия из скотча¦Bantlı mumya", "Container brute": "Bruto del contenedor¦Brute du conteneur¦Container-Koloss¦Bruto del container¦コンテナの怪力¦컨테이너 괴력자¦集装箱蛮汉¦Громила из контейнера¦Konteyner devi"},{"n1": "Un obrero que nunca fichó la salida. Casco amarillo, chaleco naranja y un arrastrar lento y constante. Equilibrado en todo.¦Un ouvrier qui n'a jamais pointé la sortie. Casque jaune, gilet orange et une démarche lente et régulière. Équilibré en tout.¦Ein Arbeiter, der nie ausgestempelt hat. Gelber Helm, orange Weste und ein langsames, gleichmäßiges Schlurfen. In allem ausgewogen.¦Un operaio che non ha mai timbrato l'uscita. Elmetto giallo, gilet arancione e un passo lento e costante. Equilibrato in tutto.¦退勤打刻をし忘れた作業員。黄色いヘルメットにオレンジのベスト、ゆっくり着実に足を引きずる。何でもそつなくこなす。¦퇴근 체크를 한 번도 못 한 현장 작업자입니다. 노란 안전모와 주황 조끼 차림으로 느리지만 꾸준히 걸어옵니다. 모든 면에서 균형 잡혔습니다.¦一直没下班打卡的工地工人。黄色安全帽、橙色马甲,步伐缓慢而稳定。各方面都很均衡。¦Рабочий, так и не отметивший уход со смены. Жёлтая каска, оранжевый жилет и медленная, ровная походка. Сбалансирован во всём.¦Mesaiyi hiç bitirmeyen bir şantiye işçisi. Sarı baret, turuncu yelek ve yavaş, düzenli bir sürünüş. Her yönüyle dengeli.", "n2": "Una caja de cartón metida en la cabeza, con ojos rojos que brillan por la rendija. Más rápido y frágil que el resto, y viene en manada.¦Une boîte en carton coincée sur la tête, les yeux rouges luisant par la fente. Plus rapide et plus fragile que les autres, il arrive en nombre.¦Ein Pappkarton steckt auf dem Kopf, rote Augen glühen durch den Schlitz. Schneller und zerbrechlicher als die anderen und kommt in Scharen.¦Una scatola di cartone in testa, con gli occhi rossi che brillano dalla fessura. Più veloce e fragile degli altri, e arriva in gruppo.¦頭に段ボール箱をかぶり、隙間から赤い目が光る。他より速くてもろく、群れで押し寄せる。¦머리에 골판지 상자를 뒤집어쓰고 틈새로 붉은 눈이 빛납니다. 다른 좀비보다 빠르고 약하며 떼로 몰려옵니다.¦头上扣着纸箱,红色眼睛从缝隙里发光。比其他僵尸更快也更脆弱,成群而来。¦Картонная коробка на голове, красные глаза светятся в прорези. Быстрее и слабее остальных, нападает толпой.¦Kafasına geçirilmiş karton kutu, aralıktan kırmızı gözler parlıyor. Diğerlerinden daha hızlı ve kırılgan; sürü halinde gelir.", "n3": "Delantal de cuero, máscara de soldar y una lluvia de chispas. Pega más fuerte que el zombi común y aguanta más disparos.¦Tablier de cuir, masque de soudeur et une pluie d'étincelles. Il frappe plus fort que le zombie ordinaire et encaisse plus de tirs.¦Lederschürze, Schweißermaske und ein Funkenregen. Er schlägt härter als der gewöhnliche Zombie und hält mehr Treffer aus.¦Grembiule di cuoio, maschera da saldatore e una pioggia di scintille. Colpisce più forte dello zombie comune e regge più colpi.¦革のエプロン、溶接マスク、飛び散る火花。普通のゾンビより一撃が重く、倒すのに数発多くかかる。¦가죽 앞치마와 용접 마스크, 쏟아지는 불꽃. 일반 좀비보다 더 세게 때리고 몇 발 더 맞아야 쓰러집니다.¦皮围裙、焊接面罩,还有一阵火花。比普通僵尸打得更重,也要多挨几枪才会倒下。¦Кожаный фартук, маска сварщика и сноп искр. Бьёт сильнее обычного зомби и выдерживает больше выстрелов.¦Deri önlük, kaynak maskesi ve bir kıvılcım yağmuru. Sıradan zombiden daha sert vurur ve devirmek için birkaç atış daha gerekir.", "n4": "Envuelto de pies a cabeza en cinta adhesiva y plástico de burbujas. Anda rígido, pero tanto envoltorio absorbe mucho daño.¦Emballé de la tête aux pieds dans du scotch et du papier bulle. Il avance raide, mais tout cet emballage encaisse beaucoup de dégâts.¦Von Kopf bis Fuß in Klebeband und Luftpolsterfolie gewickelt. Er bewegt sich steif, doch die Verpackung schluckt viel Schaden.¦Avvolto da capo a piedi in nastro adesivo e pluriball. Si muove rigido, ma tutto quell'imballaggio assorbe molti danni.¦頭から足までガムテープとプチプチでぐるぐる巻き。動きはぎこちないが、巻き付けた包装がダメージをたっぷり吸収する。¦머리부터 발끝까지 포장 테이프와 뽁뽁이로 칭칭 감겼습니다. 움직임은 뻣뻣하지만 포장이 피해를 많이 흡수합니다.¦从头到脚缠满胶带和气泡膜。动作僵硬,但这些包装能吸收大量伤害。¦Обмотан с головы до ног скотчем и плёнкой с пузырьками. Двигается скованно, но вся эта упаковка поглощает много урона.¦Baştan ayağa koli bandı ve balonlu naylonla sarılı. Sert hareket eder ama o ambalaj çok hasar emer.", "n5": "Un obrero enorme con una puerta de contenedor oxidada por pecho. Muy lento, vida enorme y golpea como una caja que cae.¦Un ouvrier colossal avec une porte de conteneur rouillée en guise de torse. Très lent, énormément de vie, et il frappe comme une caisse qui tombe.¦Ein riesiger Arbeiter mit einer rostigen Containertür als Brust. Sehr langsam, riesige Lebenspunkte und schlägt wie eine fallende Kiste.¦Un operaio gigantesco con una porta di container arrugginita al posto del petto. Lentissimo, salute enorme, colpisce come una cassa che cade.¦錆びたコンテナの扉を胸にした巨漢の作業員。とても遅く体力は桁違いで、落ちてくる木箱のように殴ってくる。¦녹슨 컨테이너 문짝을 가슴에 단 거구의 작업자입니다. 매우 느리지만 체력이 엄청나고 떨어지는 상자처럼 때립니다.¦胸前是一扇生锈集装箱门的巨汉工人。非常缓慢、血量惊人,出拳像掉落的木箱。¦Огромный рабочий с ржавой дверью контейнера вместо груди. Очень медленный, огромный запас здоровья, бьёт как падающий ящик.¦Göğsü paslı bir konteyner kapısı olan iri bir işçi. Çok yavaş, devasa canlı ve düşen bir sandık gibi vurur."});

挂着带挂锁的铁链和尖刺护腕,挥舞着巨大的货运钩。步伐沉重,稍作蓄力后猛冲。倒下时掉落宝石和一个公文包。¦Палач склада. Огромный великан в капюшоне, с пузом как ржавая дверь контейнера, цепью с навесным замком и шипастыми наручами, он размахивает гигантским грузовым крюком. Идёт тяжело, на миг замирает и бросается вперёд. Падая, роняет кристаллы и портфель.¦Depo celladı. Paslı bir konteyner kapısı gibi göbeği, asma kilitli zinciri ve dikenli bileklikleri olan başlıklı bir dev; kocaman bir yük kancası savurur. Ağır ağır yürür, bir an hazırlanır ve atılır. Düşünce mücevherler ve bir evrak çantası bırakır."});

 5 min¦工業地区 · 4:00と5分ごと¦공업 지구 · 4:00, 이후 5분마다¦工业区 · 4:00 起每 5 分钟¦Промзона · в 4:00 и каждые 5 мин¦Sanayi Bölgesi · 4:00'de ve her 5 dk'da", "Hydraulic press": "Prensa hidráulica¦Presse hydraulique¦Hydraulikpresse¦Pressa idraulica¦油圧プレス¦유압 프레스¦液压机¦Гидропресс¦Hidrolik pres", "Industrial District · 5:00 and every 5 min": "Distrito industrial · a las 5:00 y cada 5 min¦Zone industrielle · à 5:00 puis toutes les 5 min¦Industriegebiet · bei 5:00 und alle 5 Min.¦Distretto industriale · a 5:00 e ogni 5 min¦工業地区 · 5:00と5分ごと¦공업 지구 · 5:00, 이후 5분마다¦工业区 · 5:00 起每 5 分钟¦Промзона · в 5:00 и каждые 5 мин¦Sanayi Bölgesi · 5:00'de ve her 5 dk'da"},{"bR": "Rey de la arena con corona y pinzas gigantes. Ataque único: Golpe sísmico: se detiene, alza las pinzas y machaca el suelo con una explosión a su alrededor. Corre antes de que se llene el círculo rojo. Suelta gemas y un maletín.¦Roi du sable, couronné, aux pinces géantes. Attaque unique : Choc sismique — il s'arrête, lève ses pinces et frappe le sol, créant une explosion autour de lui. Fuyez avant que le cercle rouge ne se remplisse. Laisse des gemmes et une mallette.¦Sandkönig mit Krone und Riesenscheren. Einzigartiger Angriff: Erdbebenschlag – er hält an, hebt die Scheren und schmettert sie in den Boden, was eine Explosion um ihn auslöst. Lauf weg, bevor sich der rote Kreis füllt. Lässt Edelsteine und einen Aktenkoffer fallen.¦Re della sabbia con corona e chele giganti. Attacco unico: Colpo sismico — si ferma, alza le chele e sbatte il suolo con un'esplosione attorno a sé. Scappa prima che il cerchio rosso si riempia. Lascia gemme e una valigetta.¦王冠と巨大なハサミを持つ砂の王。固有攻撃「地震スラム」：立ち止まってハサミを振り上げ、周囲に爆発を起こす。赤い円が満ちる前に逃げよう。ジェムとブリーフケースを落とす。¦왕관과 거대한 집게발을 가진 모래의 왕. 고유 공격 '지진 강타': 멈춰서 집게발을 들어 올려 주변에 폭발을 일으킵니다. 붉은 원이 차오르기 전에 도망치세요. 보석과 서류가방을 떨어뜨립니다.¦戴着王冠、挥舞巨钳的沙滩之王。专属攻击“地震重击”:停下、举起大钳,砸地引发自身周围的爆炸。在红圈填满前跑开。倒下时掉落宝石和公文包。¦Король песка с короной и гигантскими клешнями. Уникальная атака: Сейсмический удар — останавливается, поднимает клешни и бьёт по земле, вызывая взрыв вокруг себя. Убегай, пока красный круг не заполнился. Роняет кристаллы и портфель.¦Taçlı ve dev kıskaçlı kum kralı. Özel saldırı: Sismik Darbe — durur, kıskaçlarını kaldırır ve yere vurup çevresinde patlama yaratır. Kırmızı daire dolmadan kaç. Mücevher ve evrak çantası bırakır.", "bJ": "Medusa gigante y eléctrica. Ataque único: Descarga voltaica: lanza un abanico de 5 orbes eléctricos que hacen daño y te ralentizan. Cuélate por los huecos.¦Méduse géante électrique. Attaque unique : Décharge voltaïque — tire un éventail de 5 orbes électriques qui blessent et vous ralentissent. Passez entre les trous.¦Riesige elektrische Qualle. Einzigartiger Angriff: Voltentladung – feuert einen Fächer aus 5 Elektro-Kugeln, die Schaden machen und dich verlangsamen. Schlüpf durch die Lücken.¦Medusa gigante elettrica. Attacco unico: Scarica voltaica — spara un ventaglio di 5 sfere elettriche che feriscono e ti rallentano. Passa tra i varchi.¦巨大な電気クラゲ。固有攻撃「ボルト放電」：5発の電撃オーブを扇状に放ち、ダメージと減速を与える。隙間をすり抜けよう。¦거대한 전기 해파리. 고유 공격 '전압 방전': 부채꼴로 전기 구체 5개를 쏘아 피해를 주고 이동을 느리게 합니다. 틈 사이로 빠져나가세요.¦巨型电击水母。专属攻击“伏特放电”:扇形射出 5 颗电球,造成伤害并使你减速。从缝隙中穿过去。¦Гигантская электрическая медуза. Уникальная атака: Вольтов разряд — выпускает веер из 5 электрических шаров, которые наносят урон и замедляют. Проскальзывай между ними.¦Dev elektrikli denizanası. Özel saldırı: Voltaj Boşalması — 5 elektrik küresini yelpaze gibi atar; hasar verir ve yavaşlatır. Boşluklardan sıyrıl.", "bT": "Tiburón monstruoso con la aleta rasgada. Ataque único: Inmersión depredadora: se hunde en la arena, solo se ve la aleta (sin daño por contacto) y emerge con un mordisco en área. Sal del círculo.¦Requin monstrueux à l'aileron déchiré. Attaque unique : Plongeon prédateur — il s'enfonce dans le sable, seul l'aileron reste visible (sans dégâts au contact), puis jaillit en une morsure de zone. Sortez du cercle.¦Monsterhai mit zerfetzter Flosse. Einzigartiger Angriff: Raubtier-Tauchgang – er versinkt im Sand, nur die Flosse ist sichtbar (kein Kontaktschaden) und bricht dann mit einem Flächenbiss hervor. Verlass den Kreis.¦Squalo mostruoso con la pinna lacerata. Attacco unico: Immersione predatrice — affonda nella sabbia, si vede solo la pinna (nessun danno da contatto) e riemerge con un morso ad area. Esci dal cerchio.¦ヒレが裂けた怪物ザメ。固有攻撃「捕食ダイブ」：砂に潜りヒレだけが見える（接触ダメージなし）。その後、範囲噛みつきで飛び出す。円から離れよう。¦지느러미가 찢어진 괴물 상어. 고유 공격 '포식자 잠수': 모래 속으로 잠기며 지느러미만 보이고(접촉 피해 없음), 이후 범위 물기로 튀어나옵니다. 원에서 벗어나세요.¦背鳍破裂的怪物鲨鱼。专属攻击“掠食潜行”:潜入沙中,只露出背鳍(无接触伤害),随后以范围撕咬破沙而出。快离开圆圈。¦Акула-монстр с рваным плавником. Уникальная атака: Хищное погружение — уходит в песок, виден лишь плавник (без урона при касании), затем вырывается укусом по площади. Выйди из круга.¦Yırtık yüzgeçli canavar köpekbalığı. Özel saldırı: Avcı Dalışı — kuma gömülür, sadece yüzgeç görünür (temas hasarı yok), sonra alan ısırığıyla fırlar. Daireden çık.", "bO": "Pulpo colosal que vive de tinta. Ataque único: Nube de tinta: escupe charcos de tinta que queman y te ralentizan varios segundos. No te quedes en ellos.¦Poulpe colossal vivant d'encre. Attaque unique : Nuage d'encre — crache des flaques d'encre qui brûlent et vous ralentissent pendant plusieurs secondes. Ne restez pas dedans.¦Kolossaler Krake, der von Tinte lebt. Einzigartiger Angriff: Tintenwolke – spuckt Tintenpfützen, die brennen und dich mehrere Sekunden verlangsamen. Bleib nicht darin stehen.¦Polpo colossale che vive d'inchiostro. Attacco unico: Nube d'inchiostro — sputa pozze d'inchiostro che bruciano e ti rallentano per diversi secondi. Non restarci dentro.¦インクで生きる巨大なタコ。固有攻撃「墨の雲」：焼けるような墨溜まりを吐き、数秒間減速させる。中に留まらないこと。¦먹물로 사는 거대한 문어. 고유 공격 '먹구름': 불타는 먹물 웅덩이를 뱉어 몇 초간 피해를 주고 느리게 만듭니다. 그 안에 서 있지 마세요.¦靠墨汁生存的巨型章鱼。专属攻击“墨云”:吐出灼烧的墨汁水洼,让你受伤并减速数秒。别站在里面。¦Колоссальный осьминог, живущий чернилами. Уникальная атака: Чернильное облако — плюёт жгучие лужи чернил, которые на несколько секунд замедляют. Не стой в них.¦Mürekkeple beslenen devasa ahtapot. Özel saldırı: Mürekkep Bulutu — yakan mürekkep birikintileri tükürür ve seni birkaç saniye yavaşlatır. İçinde durma.", "bM": "Sirena de pelo de algas y voz de ultratumba. Ataque único: Canto sónico: lanza 3 anillos sonoros seguidos, cada uno con un hueco seguro. Entra en el hueco para evitar el daño.¦Sirène aux cheveux d'algues et à la voix d'outre-tombe. Attaque unique : Chant sonique — libère 3 anneaux sonores à la suite, chacun avec une ouverture sûre. Passez par l'ouverture pour éviter les dégâts.¦Sirene mit Algenhaar und Geisterstimme. Einzigartiger Angriff: Schallgesang – sendet nacheinander 3 Schallringe aus, jeder mit einer sicheren Lücke. Tritt in die Lücke, um keinen Schaden zu nehmen.¦Sirena dai capelli d'alga e dalla voce d'oltretomba. Attacco unico: Canto sonico — emette 3 anelli sonori di fila, ciascuno con un varco sicuro. Entra nel varco per evitare il danno.¦海藻の髪と不気味な歌声を持つセイレーン。固有攻撃「ソニックソング」：安全な隙間のある音波リングを3連続で放つ。隙間に入ればダメージを避けられる。¦해초 머리와 소름 끼치는 목소리의 세이렌. 고유 공격 '음파의 노래': 안전한 틈이 있는 음파 고리 3개를 연속으로 쏩니다. 틈으로 들어가 피해를 피하세요.¦海藻长发、歌声瘆人的海妖。专属攻击“声波之歌”:连续释放 3 道声波环,每道都留有安全缺口。站进缺口即可免伤。¦Сирена с волосами из водорослей и жутким голосом. Уникальная атака: Звуковая песнь — выпускает подряд 3 звуковых кольца, в каждом есть безопасный разрыв. Встань в разрыв, чтобы не получить урон.¦Yosun saçlı, ürkütücü sesli deniz kızı. Özel saldırı: Sonik Şarkı — art arda 3 ses halkası yollar, her birinde güvenli bir boşluk vardır. Hasar almamak için boşluğa gir.", "bG": "Grúa de demolición que cobró vida. Ataque único: Bola de demolición: hace girar una bola de acero alrededor de su cuerpo durante unos segundos. Mantén la distancia hasta que se retraiga.¦Grue de démolition devenue vivante. Attaque unique : Boulet de démolition — fait tournoyer une boule d'acier autour de son corps pendant quelques secondes. Gardez vos distances jusqu'à ce qu'elle se rétracte.¦Ein zum Leben erwachter Abrisskran. Einzigartiger Angriff: Abrissbirne – schwingt einige Sekunden lang eine Stahlkugel im Kreis um seinen Körper. Halte Abstand, bis sie wieder eingezogen wird.¦Una gru da demolizione tornata in vita. Attacco unico: Palla da demolizione — fa roteare per qualche secondo una sfera d'acciaio attorno al corpo. Mantieni la distanza finché non rientra.¦命を宿した解体クレーン。固有攻撃「鉄球スイング」：数秒間、鉄球を体の周りでぐるぐる振り回す。鉄球が戻るまで距離を取ろう。¦생명을 얻은 철거 크레인. 고유 공격 '철거용 철구': 몇 초 동안 강철 공을 몸 주위로 빙글빙글 휘두릅니다. 철구가 들어갈 때까지 거리를 두세요.¦活过来的拆迁起重机。专属攻击“破拆铁球”:数秒内抡起钢球绕身旋转。在铁球收回之前保持距离。¦Оживший кран для сноса зданий. Уникальная атака: Шар-разрушитель — несколько секунд раскручивает стальной шар вокруг себя. Держи дистанцию, пока шар не втянется.¦Canlanan bir yıkım vinci. Özel saldırı: Yıkım Topu — birkaç saniye boyunca gövdesinin çevresinde çelik bir topu döndürür. Top geri çekilene kadar uzak dur.", "bL": "Robot con máscara de soldar y un soplete enorme. Ataque único: Rayo de soldadura: apunta, se fija y barre un haz de fuego giratorio que quema todo en la línea. Sal de la línea y rodéalo.¦Robot au masque de soudeur et au chalumeau géant. Attaque unique : Faisceau de soudure — il vise, se verrouille et balaie un faisceau de feu rotatif qui brûle tout sur la ligne. Quittez la ligne et contournez-le.¦Roboter mit Schweißermaske und riesigem Brenner. Einzigartiger Angriff: Schweißstrahl – zielt, rastet ein und schwenkt einen rotierenden Feuerstrahl, der alles auf der Linie verbrennt. Verlass die Linie und umkreise ihn.¦Robot con maschera da saldatore e un enorme cannello. Attacco unico: Raggio di saldatura — mira, si blocca e fa ruotare un fascio di fuoco che brucia tutto sulla linea. Esci dalla linea e aggira.¦溶接マスクと巨大なトーチを持つロボット。固有攻撃「溶接ビーム」：狙いを定めて固定し、回転する炎のビームで線上のすべてを焼く。線から外れて回り込もう。¦용접 마스크와 거대한 토치를 든 로봇. 고유 공격 '용접 광선': 조준 후 고정하고 회전하는 불꽃 광선으로 선상의 모든 것을 태웁니다. 선에서 벗어나 돌아가세요.¦戴焊工面罩、拿巨型焊枪的机器人。专属攻击“焊接光束”:瞄准锁定后横扫旋转火焰光束,烧伤线上一切。离开光束线并绕行。¦Робот в сварочной маске с огромной горелкой. Уникальная атака: Сварочный луч — целится, фиксируется и водит вращающимся огненным лучом, сжигающим всё на линии. Уйди с линии и обойди.¦Kaynak maskeli, dev meşaleli robot. Özel saldırı: Kaynak Işını — nişan alır, kilitlenir ve hattaki her şeyi yakan dönen bir ateş ışını savurur. Hattan çık ve etrafından dolan.", "bF": "Horno de hierro con brasas en el vientre. Ataque único: Rastro de escoria: por donde pasa deja charcos de metal fundido que queman varios segundos. No los pises ni te dejes acorralar.¦Fournaise de fer avec des braises dans le ventre. Attaque unique : Traînée de scories — partout où elle passe, elle laisse des flaques de métal en fusion qui brûlent plusieurs secondes. Ne les piétinez pas et évitez d'être acculé.¦Eisenofen mit Glut im Bauch. Einzigartiger Angriff: Schlackespur – wo er geht, hinterlässt er Pfützen aus geschmolzenem Metall, die mehrere Sekunden brennen. Tritt nicht hinein und lass dich nicht in die Ecke drängen.¦Fornace di ferro con braci nel ventre. Attacco unico: Scia di scorie — ovunque passi lascia pozze di metallo fuso che bruciano per diversi secondi. Non calpestarle e non farti mettere all'angolo.¦腹に燃える炭を抱えた鉄の炉。固有攻撃「スラグの軌跡」：歩いた跡に溶けた金属の水溜まりを残し、数秒間燃え続ける。踏まず、追い詰められないように。¦배 속에 불씨를 품은 철제 용광로. 고유 공격 '슬래그 자국': 걷는 곳마다 녹은 금속 웅덩이를 남기며 몇 초간 탑니다. 밟지 말고 구석에 몰리지 마세요.¦肚子里烧着炭火的铁炉怪。专属攻击“熔渣轨迹”:所过之处留下熔融金属水洼,持续灼烧数秒。别踩上去,也别被逼到角落。¦Железная печь с углями в брюхе. Уникальная атака: Шлаковый след — оставляет за собой лужи расплавленного металла, горящие несколько секунд. Не наступай и не дай загнать себя в угол.¦Karnında kor taşıyan demir fırın. Özel saldırı: Cüruf İzi — yürüdüğü her yere birkaç saniye yanan erimiş metal gölleri bırakır. Üzerine basma, köşeye sıkışma.", "bH": "Prensa gigante de ojos rojos. Ataque único: Aplastamiento en franja: marca una franja roja en el suelo (horizontal, vertical o ambas) y deja caer la prensa. Sal de la franja antes de que termine el aviso.¦Presse géante aux yeux rouges. Attaque unique : Écrasement en couloir — marque une bande rouge au sol (horizontale, verticale ou les deux) puis abat la presse. Quittez la bande avant la fin de l'avertissement.¦Riesige Presse mit roten Augen. Einzigartiger Angriff: Bahnquetschung – markiert einen roten Streifen am Boden (waagerecht, senkrecht oder beides) und lässt die Presse herabkrachen. Verlass den Streifen vor Ablauf der Warnung.¦Pressa gigante dagli occhi rossi. Attacco unico: Schiacciamento a corsia — segna una striscia rossa a terra (orizzontale, verticale o entrambe) e abbatte la pressa. Esci dalla striscia prima che finisca l'avviso.¦赤い目の巨大プレス機。固有攻撃「レーン圧殺」：地面に赤い帯（横・縦・または両方）を表示し、プレスを叩きつける。警告が終わる前に帯から出よう。¦붉은 눈의 거대한 프레스. 고유 공격 '차선 압착': 바닥에 붉은 띠(가로, 세로 또는 둘 다)를 표시한 뒤 프레스를 내리찍습니다. 경고가 끝나기 전에 띠 밖으로 나가세요.¦红眼巨型压力机。专属攻击“条带压碾”:在地面标出红色条带(横向、纵向或两者),随后重压砸下。在预警结束前离开条带。¦Гигантский пресс с красными глазами. Уникальная атака: Раздавливание полосы — отмечает на земле красную полосу (горизонтальную, вертикальную или обе) и обрушивает пресс. Уйди с полосы до конца предупреждения.¦Kırmızı gözlü dev pres. Özel saldırı: Şerit Ezme — yerde kırmızı bir şerit işaretler (yatay, dikey veya ikisi) ve presi indirir. Uyarı bitmeden şeritten çık."});

5分ごと¦어두운 교외 · 1:00, 이후 5분마다¦阴暗郊区 · 1:00 起每 5 分钟¦Мрачный пригород · в 1:00 и каждые 5 мин¦Karanlık Banliyö · 1:00'de ve her 5 dk'da", "Sinister ice cream truck": "Camión de helados siniestro¦Camion de glaces sinistre¦Unheimlicher Eiswagen¦Furgone dei gelati sinistro¦不気味なアイスクリーム車¦섬뜩한 아이스크림 트럭¦诡异冰淇淋车¦Зловещий фургон с мороженым¦Uğursuz dondurma kamyonu", "Dark Suburb · 2:00 and every 5 min": "Suburbio oscuro · a las 2:00 y cada 5 min¦Banlieue sombre · à 2:00 puis toutes les 5 min¦Dunkler Vorort · bei 2:00 und alle 5 Min.¦Periferia oscura · a 2:00 e ogni 5 min¦暗い郊外 · 2:00と5分ごと¦어두운 교외 · 2:00, 이후 5분마다¦阴暗郊区 · 2:00 起每 5 分钟¦Мрачный пригород · в 2:00 и каждые 5 мин¦Karanlık Banliyö · 2:00'de ve her 5 dk'da", "Giant scarecrow": "Espantapájaros gigante¦Épouvantail géant¦Riesen-Vogelscheuche¦Spaventapasseri gigante¦巨大かかし¦거대 허수아비¦巨型稻草人¦Гигантское пугало¦Dev korkuluk", "Dark Suburb · 3:00 and every 5 min": "Suburbio oscuro · a las 3:00 y cada 5 min¦Banlieue sombre · à 3:00 puis toutes les 5 min¦Dunkler Vorort · bei 3:00 und alle 5 Min.¦Periferia oscura · a 3:00 e ogni 5 min¦暗い郊外 · 3:00と5分ごと¦어두운 교외 · 3:00, 이후 5분마다¦阴暗郊区 · 3:00 起每 5 分钟¦Мрачный пригород · в 3:00 и каждые 5 мин¦Karanlık Banliyö · 3:00'de ve her 5 dk'da", "Neighborhood gravedigger": "Sepulturero del barrio¦Fossoyeur du quartier¦Friedhofsgräber¦Becchino del quartiere¦街の墓守¦동네 무덤지기¦街区掘墓人¦Могильщик района¦Mahalle mezarcısı", "Dark Suburb · 4:00 and every 5 min": "Suburbio oscuro · a las 4:00 y cada 5 min¦Banlieue sombre · à 4:00 puis toutes les 5 min¦Dunkler Vorort · bei 4:00 und alle 5 Min.¦Periferia oscura · a 4:00 e ogni 5 min¦暗い郊外 · 4:00と5分ごと¦어두운 교외 · 4:00, 이후 5분마다¦阴暗郊区 · 4:00 起每 5 分钟¦Мрачный пригород · в 4:00 и каждые 5 мин¦Karanlık Banliyö · 4:00'de ve her 5 dk'da", "Alpha werewolf": "Hombre lobo alfa¦Loup-garou alpha¦Alpha-Werwolf¦Lupo mannaro alfa¦アルファ人狼¦알파 늑대인간¦头狼人¦Альфа-оборотень¦Alfa kurt adam", "Dark Suburb · 5:00 and every 5 min": "Suburbio oscuro · a las 5:00 y cada 5 min¦Banlieue sombre · à 5:00 puis toutes les 5 min¦Dunkler Vorort · bei 5:00 und alle 5 Min.¦Periferia oscura · a 5:00 e ogni 5 min¦暗い郊外 · 5:00と5分ごと¦어두운 교외 · 5:00, 이후 5분마다¦阴暗郊区 · 5:00 起每 5 分钟¦Мрачный пригород · в 5:00 и каждые 5 мин¦Karanlık Banliyö · 5:00'de ve her 5 dk'da"},{"s1": "Un niño disfrazado de morado con una calabaza encendida por cabeza. Avanza sin prisa y suelta una risa ronca. Equilibrado en todo.¦Un enfant déguisé en violet avec une citrouille allumée en guise de tête. Il avance sans hâte en poussant un rire rauque. Équilibré en tout.¦Ein Kind im lila Kostüm mit leuchtendem Kürbis als Kopf. Es schlurft gemächlich und lacht heiser. In allem ausgewogen.¦Un bambino in costume viola con una zucca accesa al posto della testa. Avanza senza fretta con una risata roca. Equilibrato in tutto.¦紫の衣装を着た、頭が光るカボチャの子ども。のろのろ歩き、かすれた笑い声をあげる。すべてがバランス型。¦보라색 의상에 불 켜진 호박을 머리로 쓴 아이입니다. 느릿느릿 걸으며 쉰 웃음소리를 냅니다. 모든 면에서 균형형입니다.¦穿紫色服装、头是发光南瓜的孩子。慢悠悠地走着,发出沙哑的笑声。各方面都很均衡。¦Ребёнок в фиолетовом костюме с горящей тыквой вместо головы. Бредёт не спеша и хрипло смеётся. Сбалансирован во всём.¦Mor kostümlü, kafası yanan bir balkabağı olan çocuk. Acele etmeden yürür ve boğuk bir kahkaha atar. Her yönden dengeli.", "s2": "Una sábana blanca con dos agujeros por ojos, flotando y ondulando. Frágil, pero aparece por todas partes en la oscuridad.¦Un drap blanc avec deux trous pour les yeux, qui flotte et ondule. Fragile, mais il surgit de partout dans l'obscurité.¦Ein weißes Bettlaken mit zwei Augenlöchern, das schwebt und schwankt. Zerbrechlich, aber im Dunkeln taucht es überall auf.¦Un lenzuolo bianco con due buchi per gli occhi, che fluttua e ondeggia. Fragile, ma spunta da ogni parte nel buio.¦目の穴が二つ開いた白いシーツが、ふわふわと揺れながら漂う。もろいが、暗闇のあちこちから現れる。¦눈구멍이 두 개 뚫린 하얀 시트가 둥둥 떠서 흔들립니다. 약하지만 어둠 속 사방에서 나타납니다.¦有两个眼洞的白床单,飘浮着摇摆前行。很脆弱,但会在黑暗中从四面八方冒出来。¦Белая простыня с двумя дырками для глаз, которая парит и покачивается. Хрупкая, но появляется отовсюду в темноте.¦İki göz deliği olan, süzülüp sallanan beyaz bir çarşaf. Kırılgan ama karanlıkta her yerden çıkar.", "s3": "Paja, un sombrero viejo y ojos rojos brillantes. Lento, pero aguanta muchos disparos y golpea fuerte.¦De la paille, un vieux chapeau et des yeux rouges brillants. Lent, mais encaisse beaucoup de tirs et frappe fort.¦Stroh, ein alter Hut und leuchtend rote Augen. Langsam, hält aber viele Treffer aus und schlägt hart zu.¦Paglia, un vecchio cappello e occhi rossi luminosi. Lento, ma regge molti colpi e picchia forte.¦わら、古い帽子、赤く光る目。動きは遅いが、多くの弾に耐え、一撃も重い。¦짚, 낡은 모자, 붉게 빛나는 눈. 느리지만 많은 공격을 버티고 세게 때립니다.¦稻草、旧帽子和发红光的眼睛。行动缓慢,但很耐打,出手也重。¦Солома, старая шляпа и светящиеся красные глаза. Медленный, но выдерживает много выстрелов и сильно бьёт.¦Saman, eski bir şapka ve parlayan kırmızı gözler. Yavaş ama çok mermi yer ve sert vurur.", "s4": "Diminutos, rapidísimos y siempre en trío. Débiles, pero atacan desde todos lados en la oscuridad.¦Minuscules, ultra rapides et toujours par trois. Faibles, mais ils attaquent de tous côtés dans le noir.¦Winzig, superschnell und immer zu dritt. Schwach, aber sie greifen im Dunkeln von allen Seiten an.¦Minuscoli, velocissimi e sempre in tre. Deboli, ma attaccano da ogni lato nel buio.¦小さくて超高速、いつも3匹で行動する。弱いが、暗闇の中あらゆる方向から襲ってくる。¦작고 아주 빠르며 항상 세 마리가 함께 다닙니다. 약하지만 어둠 속 사방에서 덮칩니다.¦体型很小、速度极快,总是三只一组。虽然弱,但会在黑暗中从四面八方袭来。¦Крошечные, сверхбыстрые и всегда втроём. Слабые, но нападают из темноты со всех сторон.¦Minik, süper hızlı ve hep üçlü gelir. Zayıf ama karanlıkta her yönden saldırır.", "s5": "El vecino que nunca duerme: bata, rulos en el pelo y un rastrillo en la mano. El más lento y resistente de la cuadra.¦Le voisin qui ne dort jamais : peignoir, bigoudis et un râteau à la main. Le plus lent et le plus coriace du quartier.¦Der Nachbar, der nie schläft: Bademantel, Lockenwickler und eine Harke in der Hand. Der langsamste und zäheste im Viertel.¦Il vicino che non dorme mai: vestaglia, bigodini e un rastrello in mano. Il più lento e resistente dell'isolato.¦決して眠らない隣人。バスローブにカーラー、手には熊手。街区で最も遅く、最も頑丈。¦절대 잠들지 않는 이웃입니다. 목욕가운에 헤어롤, 손에는 갈퀴를 들었습니다. 동네에서 가장 느리고 튼튼합니다.¦从不睡觉的邻居:浴袍、卷发筒,手里拿着耙子。街区里最慢也最耐打的一个。¦Сосед, который никогда не спит: халат, бигуди и грабли в руке. Самый медленный и крепкий на районе.¦Hiç uyumayan komşu: bornoz, bigudi ve elinde tırmık. Mahallenin en yavaş ve en dayanıklısı.", "bA": "Una casa que se arrancó de la acera, con ventanas llameantes y una puerta-boca llena de dientes. Ataque único: Poltergeist: abre las ventanas y suelta un anillo de 10 orbes fantasma en todas direcciones. Pasa por los huecos entre ellos.¦Une maison arrachée du trottoir, aux fenêtres flamboyantes et à la porte-bouche pleine de dents. Attaque unique : Poltergeist — elle ouvre ses fenêtres et libère un anneau de 10 orbes fantômes dans toutes les directions. Faufilez-vous entre eux.¦Ein Haus, das sich vom Bordstein losgerissen hat, mit lodernden Fenstern und einem Türmaul voller Zähne. Einzigartiger Angriff: Poltergeist – reißt die Fenster auf und schickt einen Ring aus 10 Geisterkugeln in alle Richtungen. Schlüpf durch die Lücken dazwischen.¦Una casa strappatasi dal marciapiede, con finestre fiammeggianti e una porta-bocca piena di denti. Attacco unico: Poltergeist — spalanca le finestre e libera un anello di 10 sfere fantasma in ogni direzione. Passa tra i varchi.¦歩道から立ち上がった家。燃える窓と、牙だらけのドアの口を持つ。固有攻撃「ポルターガイスト」：窓を開け放ち、10個の幽霊オーブを全方向へ放つ。オーブの間をすり抜けよう。¦보도에서 일어선 집으로, 이글거리는 창문과 이빨이 가득한 문 입을 가졌습니다. 고유 공격 '폴터가이스트': 창문을 활짝 열고 유령 구체 10개를 사방으로 쏩니다. 구체 사이 틈으로 빠져나가세요.¦从人行道上站起来的房子,窗户燃着火光,门嘴里满是利齿。专属攻击“恶作剧幽灵”:推开所有窗户,向四面八方释放一圈 10 颗幽灵球。从球与球的缝隙中穿过。¦Дом, оторвавшийся от тротуара, с пылающими окнами и пастью-дверью, полной зубов. Уникальная атака: Полтергейст — распахивает окна и выпускает кольцо из 10 призрачных шаров во все стороны. Проскальзывай между ними.¦Kaldırımdan kopup ayağa kalkan, alev alev pencereli ve dişlerle dolu kapı ağızlı bir ev. Özel saldırı: Poltergeist — pencereleri açar ve her yöne 10 hayalet küreden oluşan bir halka yollar. Aralarındaki boşluklardan geç.", "bI": "Un camión de helados que toca una musiquita de ultratumba. Ataque único: Jingle hipnótico: toca su melodía y te arrastra hacia él mientras acelera. Corre en sentido contrario hasta que pare la música.¦Un camion de glaces qui joue une petite mélodie hantée. Attaque unique : Jingle hypnotique — il joue sa mélodie et vous attire vers lui tout en accélérant. Fuyez dans l'autre sens jusqu'à la fin de la musique.¦Ein Eiswagen, der eine gruselige kleine Melodie spielt. Einzigartiger Angriff: Hypnotischer Jingle – spielt seine Melodie und zieht dich zu sich heran, während er beschleunigt. Lauf in die Gegenrichtung, bis die Musik endet.¦Un furgone dei gelati che suona un motivetto stregato. Attacco unico: Jingle ipnotico — suona la melodia e ti attira a sé mentre accelera. Corri nella direzione opposta finché la musica non si ferma.¦不気味なメロディを鳴らすアイスクリームのトラック。固有攻撃「催眠ジングル」：曲を流し、加速しながらあなたを引き寄せる。音楽が止まるまで反対方向へ逃げよう。¦으스스한 멜로디를 틀어대는 아이스크림 트럭입니다. 고유 공격 '최면 징글': 멜로디를 틀어 가속하면서 당신을 끌어당깁니다. 음악이 멈출 때까지 반대 방향으로 도망치세요.¦播放着阴森小曲的冰淇淋车。专属攻击“催眠铃声”:奏响旋律,一边加速一边把你吸向它。朝相反方向跑,直到音乐停止。¦Фургон с мороженым, играющий жуткую мелодию. Уникальная атака: Гипнотический джингл — включает мелодию и притягивает тебя к себе, разгоняясь. Беги в другую сторону, пока музыка не стихнет.¦Ürkütücü bir melodi çalan dondurma kamyonu. Özel saldırı: Hipnotik Jingle — melodisini çalar ve hızlanırken seni kendine çeker. Müzik duruncaya kadar ters yöne koş.", "bE": "Espantapájaros de paja con sombrero viejo y ojos encendidos. Ataque único: Bandada de cuervos: suelta 4 cuervos que te persiguen girando hacia ti. Corre en círculos para despistarlos.¦Épouvantail de paille au vieux chapeau et aux yeux ardents. Attaque unique : Nuée de corbeaux — lâche 4 corbeaux qui vous pourchassent en virant vers vous. Courez en cercles pour les semer.¦Eine Stroh-Vogelscheuche mit altem Hut und glühenden Augen. Einzigartiger Angriff: Krähenschwarm – lässt 4 Krähen los, die dich in Kurven verfolgen. Lauf im Kreis, um sie abzuschütteln.¦Uno spaventapasseri di paglia con un vecchio cappello e occhi in fiamme. Attacco unico: Stormo di corvi — libera 4 corvi che ti inseguono curvando verso di te. Corri in cerchio per seminarli.¦古い帽子と燃える目を持つわらのかかし。固有攻撃「カラスの群れ」：4羽のカラスを放ち、カーブしながら追尾してくる。円を描くように走って振り切ろう。¦낡은 모자와 불타는 눈을 가진 짚 허수아비입니다. 고유 공격 '까마귀 떼': 까마귀 4마리를 풀어 곡선을 그리며 쫓아옵니다. 원을 그리며 달려 따돌리세요.¦戴旧帽子、双眼燃烧的稻草人。专属攻击“乌鸦群”:放出 4 只乌鸦,拐着弯追踪你。绕圈跑可以甩开它们。¦Соломенное пугало в старой шляпе с горящими глазами. Уникальная атака: Стая ворон — выпускает 4 ворон, которые преследуют тебя, делая виражи. Беги по кругу, чтобы оторваться.¦Eski şapkalı, gözleri yanan saman korkuluk. Özel saldırı: Karga Sürüsü — seni kavisler çizerek kovalayan 4 karga salar. Onlardan kurtulmak için daireler çizerek koş.", "bZ": "Sepulturero de abrigo largo con farol y una pala oxidada. Ataque único: Tumbas abiertas: marca tumbas en el suelo (una justo bajo ti) y al estallar sueltan zombis. Sal de los círculos antes de que salte la tierra.¦Fossoyeur en long manteau, avec une lanterne et une pelle rouillée. Attaque unique : Tombes ouvertes — marque des tombes au sol (une juste sous vous) et, en éclatant, elles libèrent des zombies. Quittez les cercles avant que la terre ne vole.¦Ein Totengräber im langen Mantel mit Laterne und rostigem Spaten. Einzigartiger Angriff: Offene Gräber – markiert Gräber am Boden (eines direkt unter dir), die beim Aufplatzen Zombies freisetzen. Verlass die Kreise, bevor die Erde fliegt.¦Un becchino in lungo cappotto con lanterna e pala arrugginita. Attacco unico: Tombe aperte — segna tombe sul terreno (una proprio sotto di te) e, quando esplodono, liberano zombie. Esci dai cerchi prima che voli la terra.¦ランタンと錆びたシャベルを持つ、長いコートの墓守。固有攻撃「開く墓穴」：地面に墓穴を（1つは足元に）示し、爆発するとゾンビが出てくる。土が飛ぶ前に円から出よう。¦랜턴과 녹슨 삽을 든 긴 코트의 무덤지기입니다. 고유 공격 '열린 무덤': 바닥에 무덤을(하나는 바로 발밑에) 표시하고, 터지면 좀비가 쏟아집니다. 흙이 튀기 전에 원에서 벗어나세요.¦穿长外套、提着提灯、拿着生锈铁锹的掘墓人。专属攻击“墓穴大开”:在地面标出墓穴(其中一个就在你脚下),爆开时会放出僵尸。在泥土飞溅前离开圆圈。¦Могильщик в длинном пальто с фонарём и ржавой лопатой. Уникальная атака: Раскрытые могилы — отмечает на земле могилы (одну прямо под тобой), а когда они взрываются, из них выходят зомби. Выйди из кругов до взрыва.¦Uzun paltolu, fenerli ve paslı küreği olan mezarcı. Özel saldırı: Açık Mezarlar — yerde mezarlar işaretler (biri tam altında) ve patlayınca zombiler çıkar. Toprak fırlamadan daireden çık.", "bW": "El líder de la manada, enorme y con el pelo erizado. Ataque único: Aullido lunar: se detiene y aúlla, lanzando una onda de sonido con un hueco seguro y haciendo más rápidos a los demás monstruos durante 5 s. Entra en el hueco.¦Le chef de meute, immense et hérissé. Attaque unique : Hurlement lunaire — il s'arrête et hurle, envoyant une onde sonore avec une ouverture sûre et rendant tous les autres monstres plus rapides pendant 5 s. Passez par l'ouverture.¦Der Rudelführer, riesig und mit gesträubtem Fell. Einzigartiger Angriff: Mondgeheul – er hält an und heult, sendet eine Schallwelle mit einer sicheren Lücke und macht alle anderen Monster 5 s lang schneller. Tritt in die Lücke.¦Il capobranco, enorme e dal pelo ritto. Attacco unico: Ululato lunare — si ferma e ulula, emettendo un'onda sonora con un varco sicuro e rendendo più veloci tutti gli altri mostri per 5 s. Entra nel varco.¦毛を逆立てた巨大な群れのリーダー。固有攻撃「月の遠吠え」：立ち止まって吠え、安全な隙間のある音波を放ち、他のモンスターを5秒間加速させる。隙間に入ろう。¦털을 곤두세운 거대한 무리의 우두머리입니다. 고유 공격 '달의 울부짖음': 멈춰서 울부짖으며 안전한 틈이 있는 음파를 쏘고, 다른 모든 몬스터를 5초간 빠르게 만듭니다. 틈으로 들어가세요.¦毛发倒竖、体型庞大的狼群首领。专属攻击“月下嚎叫”:停下嚎叫,放出带安全缺口的声波,并让其他所有怪物加速 5 秒。踏进缺口里。¦Огромный вожак стаи со вздыбленной шерстью. Уникальная атака: Вой на луну — останавливается и воет, выпуская звуковую волну с безопасным разрывом и ускоряя всех остальных монстров на 5 с. Встань в разрыв.¦Tüyleri diken diken, kocaman sürü lideri. Özel saldırı: Ay Uluması — durup uluyarak güvenli boşluklu bir ses dalgası yollar ve diğer tüm canavarları 5 sn hızlandırır. Boşluğa gir."});
EN['Provisório pra sempre']='Temporary forever';EN['Você fez uma gambiarra: jogou os cristais de XP dentro do tanque e eles acabam se fundindo dentro do motor. Parece que funcionou, kkk. A cada 2 cristais absorvidos há chance de fusão: o motor cospe pelo escapamento um cristal especial que fica no mapa valendo o dobro de XP. Cada nível: mais chance de fusão. Vai até o nível 5.']='You rigged a hack: you dumped the XP crystals into the tank and they end up fusing inside the engine. Looks like it worked, lol. Every 2 crystals absorbed have a chance to fuse: the engine spits a special crystal out of the exhaust that stays on the map and is worth double XP. Each level: more chance to fuse. Up to level 5.';
(function(N){var LG=['es','fr','de','it','ja','ko','zh','ru','tr'];for(var k in N){var v=N[k].split('¦');LG.forEach(function(l,i){D18[l][k]=v[i]})}})({"Your bike leaves oil puddles behind, and enemies who step in them slow down a lot. Each level: bigger, longer-lasting puddles and more slowdown. Up to level 5. Fire sets it ablaze: the flaming exhaust, bombs, firecrackers and the bikers light the puddle, which burns whoever stands on it and spreads to nearby puddles, but lasts much less.":"Tu moto deja charcos de aceite por donde pasa, y los enemigos que los pisan van mucho más lentos. Cada nivel: charcos más grandes, más duraderos y más lentitud. Llega hasta el nivel 5. Con fuego se incendia: el escape en llamas, las bombas, los petardos y los motoristas encienden el charco, que quema a quien esté encima y se propaga a los charcos vecinos, pero dura mucho menos.¦Ta moto laisse des flaques d'huile sur son passage, et les ennemis qui marchent dedans ralentissent beaucoup. Chaque niveau : flaques plus grandes, plus durables et plus de lenteur. Jusqu'au niveau 5. Le feu l'embrase : le pot d'échappement en flammes, les bombes, les pétards et les motards allument la flaque, qui brûle ceux qui sont dessus et se propage aux flaques voisines, mais dure bien moins longtemps.¦Dein Motorrad hinterlässt Ölpfützen, und Gegner, die hineintreten, werden deutlich langsamer. Pro Stufe: größere, länger haltende Pfützen und stärkere Verlangsamung. Bis Stufe 5. Feuer setzt sie in Brand: Der flammende Auspuff, Bomben, Knallkörper und die Biker zünden die Pfütze an, die alle darauf verbrennt und sich auf Nachbarpfützen ausbreitet, aber viel kürzer hält.¦La tua moto lascia pozze d'olio al suo passaggio e i nemici che ci mettono piede rallentano molto. Ogni livello: pozze più grandi, più durature e più lentezza. Fino al livello 5. Il fuoco la incendia: lo scarico in fiamme, le bombe, i petardi e i motociclisti accendono la pozza, che brucia chi ci sta sopra e si propaga alle pozze vicine, ma dura molto meno.¦バイクが通った跡に油だまりを残し、踏んだ敵は大きく減速する。レベルごとに油だまりが大きく長持ちになり、減速も強まる。最大レベル5。 炎で燃え上がる:炎のマフラー、爆弾、爆竹、バイカーたちが油だまりに火をつけ、上にいる敵を焼き、近くの油だまりへ燃え広がるが、持続時間は大きく短くなる。¦오토바이가 지나간 자리에 기름 웅덩이를 남기고, 밟은 적은 크게 느려집니다. 레벨마다 웅덩이가 더 크고 오래가며 더 많이 느려집니다. 최대 5레벨. 불이 붙으면 타오릅니다: 불꽃 배기구, 폭탄, 폭죽, 바이커들이 기름 웅덩이에 불을 붙여 위에 있는 적을 태우고 근처 웅덩이로 번지지만 지속 시간은 훨씬 짧아집니다.¦你的摩托车会在经过的地方留下油坑,踩到的敌人会大幅减速。每升一级:油坑更大、持续更久、减速更强。最高5级。 遇火会燃烧:火焰排气管、炸弹、鞭炮和飙车党都会点燃油坑,烧伤其上的敌人并蔓延到附近的油坑,但持续时间会大大缩短。¦Твой мотоцикл оставляет за собой лужи масла, и враги, наступившие в них, сильно замедляются. С каждым уровнем лужи больше, держатся дольше и замедляют сильнее. До 5 уровня. Огонь поджигает её: пылающий выхлоп, бомбы, петарды и байкеры зажигают лужу — она жжёт всех, кто стоит сверху, и распространяется на соседние лужи, но держится гораздо меньше.¦Motorun geçtiği yerde yağ birikintileri bırakır ve üzerine basan düşmanlar çok yavaşlar. Her seviye: daha büyük, daha uzun süren birikintiler ve daha fazla yavaşlama. 5. seviyeye kadar. Ateş onu tutuşturur: alevli egzoz, bombalar, havai fişekler ve motorcular yağ birikintisini yakar; üzerindeki düşmanları yakar ve yakındaki birikintilere yayılır, ancak çok daha kısa sürer.","Temporary forever":"Provisional para siempre¦Provisoire pour toujours¦Für immer provisorisch¦Provvisorio per sempre¦仮設のまま永遠に¦임시방편이 영원히¦永远的临时方案¦Временно навсегда¦Geçici ama kalıcı","You rigged a hack: you dumped the XP crystals into the tank and they end up fusing inside the engine. Looks like it worked, lol. Every 2 crystals absorbed have a chance to fuse: the engine spits a special crystal out of the exhaust that stays on the map and is worth double XP. Each level: more chance to fuse. Up to level 5.":"Armaste una chapuza: echaste los cristales de XP al tanque y acaban fundiéndose dentro del motor. Parece que funcionó, jaja. Cada 2 cristales absorbidos hay probabilidad de fusión: el motor escupe por el escape un cristal especial que se queda en el mapa y vale el doble de XP. Cada nivel: más probabilidad de fusión. Llega hasta el nivel 5.¦Tu as bricolé un truc : tu as jeté les cristaux d'XP dans le réservoir et ils finissent par fusionner dans le moteur. Ça a l'air de marcher, lol. Tous les 2 cristaux absorbés, ils ont une chance de fusionner : le moteur crache par le pot d'échappement un cristal spécial qui reste sur la carte et vaut le double d'XP. Chaque niveau : plus de chance de fusion. Jusqu'au niveau 5.¦Du hast eine Bastellösung gebaut: Du hast die XP-Kristalle in den Tank geworfen und sie verschmelzen im Motor. Scheint zu funktionieren, lol. Je 2 aufgenommene Kristalle besteht eine Chance auf Verschmelzung: Der Motor spuckt aus dem Auspuff einen besonderen Kristall aus, der auf der Karte liegen bleibt und doppelt so viel XP wert ist. Pro Stufe: mehr Chance auf Verschmelzung. Bis Stufe 5.¦Hai fatto una soluzione di fortuna: hai buttato i cristalli di XP nel serbatoio e si fondono dentro il motore. Sembra che abbia funzionato, lol. Ogni 2 cristalli assorbiti c'è una probabilità di fusione: il motore sputa dallo scarico un cristallo speciale che resta sulla mappa e vale il doppio di XP. Ogni livello: più probabilità di fusione. Fino al livello 5.¦苦肉の策でXPクリスタルをタンクに放り込んだら、エンジンの中で融合するようになった。うまくいったみたい(笑)。クリスタルを2個吸収するごとに融合のチャンスがあり、エンジンがマフラーから特別なクリスタルを吐き出す。それはマップに残り、XPが2倍になる。レベルごとに融合の確率アップ。最大レベル5。¦임시방편으로 XP 크리스털을 연료 탱크에 던져 넣었더니 엔진 안에서 융합됩니다. 먹힌 것 같네요 ㅋㅋ 크리스털을 2개 흡수할 때마다 융합할 확률이 있으며, 엔진이 배기구로 특수 크리스털을 뱉어 냅니다. 이 크리스털은 맵에 남아 있고 XP를 두 배로 줍니다. 레벨마다 융합 확률 증가. 최대 5레벨.¦你搞了个临时方案:把XP水晶扔进油箱,结果它们在发动机里融合了。看来管用,哈哈。每吸收2颗水晶就有几率融合:发动机会从排气管吐出一颗特殊水晶,它会留在地图上,价值双倍XP。每升一级:融合几率更高。最高5级。¦Ты сделал самоделку: закинул кристаллы опыта в бак, и они сливаются внутри двигателя. Похоже, сработало, лол. Каждые 2 поглощённых кристалла могут слиться: двигатель выплёвывает из выхлопной трубы особый кристалл, который остаётся на карте и даёт вдвое больше опыта. С каждым уровнем шанс слияния выше. До 5 уровня.¦Bir geçici çözüm yaptın: XP kristallerini depoya attın ve motorun içinde kaynaşıyorlar. Galiba işe yaradı, lol. Emilen her 2 kristalde kaynaşma şansı vardır: motor egzozdan haritada kalan ve iki kat XP değerinde özel bir kristal tükürür. Her seviye: daha fazla kaynaşma şansı. 5. seviyeye kadar."});

var SFX=(function(){
 var ac=null,mg=null,nb=null,last={},nx={z:0,v:0,p:0,b:0},vg=0,hooked=0;
 function init(){

   ac=new AC();mg=ac.createGain();mg.gain.value=0.55;

   nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   if(!hooked){hooked=1;document.addEventListener('visibilitychange',function(){if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()})}
  }catch(e){ac=null}
 }
 function ok(k,gap){

  var t=ac.currentTime;if(last[k]!==undefined&&t-last[k]<gap)return false;last[k]=t;return true;
 }
 function env(g,t,a,d,pk){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
 function tone(type,f0,f1,t,dur,vol,a,flt){
  var o=ac.createOscillator(),g=ac.createGain(),out=g;o.type=type;

  if(flt){var f=ac.createBiquadFilter();f.type=flt[0];f.frequency.value=flt[1];f.Q.value=flt[2]||1;o.connect(f);f.connect(g)}else o.connect(g);

 }

 }
 function vib(o,hz,depth,t,dur){var l=ac.createOscillator(),g=ac.createGain();l.frequency.value=hz;g.gain.value=depth;l.connect(g);g.connect(o.frequency);l.start(t);l.stop(t+dur+0.06)}
 // ---- vozes dos monstros ----
 function zombie(vol){

  o.frequency.setValueAtTime(132,t);o.frequency.linearRampToValueAtTime(112,t+0.45);o.frequency.exponentialRampToValueAtTime(78,t+dur);

  var g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.14);g.gain.setValueAtTime(vol,t+0.55);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  var o=ac.createOscillator();o.type='sawtooth';

 function ronk(t,vol,pm){

 }
 function hic(t,vol,pm){

 function pig(vol,pm){

 }
 var VO={z:zombie,v:vampire,p:function(v){return pig(v,1)},b:function(v){return pig(v*1.5,0.62)}};

  var c={z:0,v:0,p:0,b:0},nr={z:1e9,v:1e9,p:1e9,b:1e9},hw=W/2+30,hh=H/2+30;
  for(var i=0;i<S.en.length;i++){
   var e=S.en[i],dx=e.x-S.x,dy=e.y-S.y;
   if(Math.abs(dx)>hw||Math.abs(dy)>hh)continue;
   var k=e.boss?(e.bt&&e.bt!=='P'?'x':'b'):e.k,d=Math.hypot(dx,dy);if(!(k in c))continue;c[k]++;if(d<nr[k])nr[k]=d;
  }
  var ord=['b','p','v','z'];

   var k2=ord[j];

    var prox=1-Math.min(1,nr[k2]/Math.max(W,H));
    var vol=0.06+0.08*prox+0.03*Math.min(1,c[k2]/10);
    var dur=VO[k2](vol);
    nx[k2]=t+dur+3;vg=t+dur+0.2;
    break;
   }
  }
 }

 {id:'m1',n:['Caranguejo-zumbi','Zombie crab'],hp:'12',sp:50,dm:11,xp:1,w:['Orla da Praia','Beach Front'],
  d:['Saiu da areia com as garras para o alto e vem andando devagar, de frente, como um bom zumbi. Os olhos em hastes não perdem a sua moto de vista.','Crawled out of the sand with its claws raised and shambles forward like a proper zombie. Its eye stalks never lose sight of your bike.']},
 {id:'m2',n:['Homem-água-viva','Jellyfish man'],hp:'9',sp:58,dm:9,xp:1,w:['Orla da Praia','Beach Front'],
  d:['Um banhista que levou um choque de água-viva e nunca mais foi o mesmo. Cabeça gelatinosa rosa, tentáculos balançando e um andar bambo.','A swimmer who got zapped by a jellyfish and was never the same. Pink gelatinous head, swaying tentacles and a wobbly walk.']},
 {id:'m3',n:['Tubarão-zumbi','Zombie shark'],hp:'16',sp:52,dm:13,xp:2,w:['Orla da Praia','Beach Front'],
  d:['Trocou o mar pela calçada. Com a barbatana na cabeça e dentes à mostra, é mais resistente e morde mais forte que o zumbi comum.','Traded the sea for the sidewalk. With a fin on its head and teeth on show, it is tougher and bites harder than the common zombie.']},
 {id:'m4',n:['Náufrago de alga','Seaweed castaway'],hp:'10',sp:55,dm:10,xp:1,w:['Orla da Praia','Beach Front'],
  d:['Passou tanto tempo no fundo do mar que virou parte dele. Cabelo de alga pingando, pele azul-esverdeada e passo arrastado.','Spent so long on the sea floor it became part of it. Dripping seaweed hair, blue-green skin and a dragging step.']},
 {id:'m5',n:['Polvo-zumbi','Zombie octopus'],hp:'14',sp:48,dm:12,xp:2,w:['Orla da Praia','Beach Front'],
  d:['Cabeção roxo, olhos enormes e tentáculos balançando dos lados. É o mais lento do bando, mas aguenta bastante.','Big purple head, huge eyes and tentacles swinging at its sides. The slowest of the bunch, but it can take a lot of hits.']},
 {id:'n1',n:['Zumbi de capacete', 'Hardhat zombie'],hp:'14',sp:52,dm:11,xp:1,w:['Distrito Industrial','Industrial District'],
  d:["Um operário que nunca bateu o ponto de saída. Capacete amarelo, colete laranja e um arrastar lento e constante. Equilibrado em tudo.", "A site worker who never clocked out. Bright yellow hard hat, orange vest and a slow, steady shuffle. Balanced in every way."]},
 {id:'n2',n:['Zumbi cabeça de caixa', 'Box-head zombie'],hp:'10',sp:62,dm:9,xp:1,w:['Distrito Industrial','Industrial District'],
  d:["Uma caixa de papelão enfiada na cabeça, com olhos vermelhos brilhando na fresta. Mais rápido e frágil que os outros, e vem em bando.", "A cardboard box stuck on its head, red eyes glowing through the slit. Faster and frailer than the rest, and it swarms in numbers."]},
 {id:'n3',n:['Zumbi soldador', 'Welder zombie'],hp:'16',sp:50,dm:13,xp:2,w:['Distrito Industrial','Industrial District'],
  d:["Avental de couro, máscara de solda e uma chuva de faíscas. Bate mais forte que o zumbi comum e aguenta mais tiros.", "Leather apron, welding mask and a shower of sparks. It hits harder than the common zombie and takes a few more shots to put down."]},
 {id:'n4',n:['Múmia de fita', 'Tape mummy'],hp:'18',sp:46,dm:10,xp:2,w:['Distrito Industrial','Industrial District'],
  d:["Enrolado da cabeça aos pés em fita adesiva e plástico-bolha. Anda duro, mas todo esse embrulho absorve muito dano.", "Wrapped head to toe in packing tape and bubble wrap. It moves stiffly, but all that wrapping soaks up a lot of damage."]},
 {id:"s1",n:["Zumbi-abóbora","Pumpkin zombie"],hp:"14",sp:50,dm:11,xp:1,w:['Subúrbio Sombrio','Dark Suburb'],
  d:["Uma criança de fantasia roxa com uma abóbora acesa no lugar da cabeça. Anda sem pressa e solta uma risada rouca. Equilibrada em tudo.","A kid in a purple costume with a glowing pumpkin for a head. It shambles along and wheezes a hoarse laugh. Balanced in every way."]},
 {id:"s2",n:["Fantasma de lençol","Bedsheet ghost"],hp:"10",sp:58,dm:10,xp:1,w:['Subúrbio Sombrio','Dark Suburb'],
  d:["Um lençol branco com dois buracos no lugar dos olhos, flutuando devagar e ondulando. Frágil, mas aparece de todo lado na escuridão.","A white bedsheet with two eye holes, floating and swaying. Fragile, but it shows up from everywhere in the dark."]},
 {id:"s3",n:["Espantalho","Scarecrow"],hp:"20",sp:42,dm:13,xp:2,w:['Subúrbio Sombrio','Dark Suburb'],
  d:["Palha, chapéu velho e olhos vermelhos brilhantes. Lento, mas aguenta muitos tiros e bate forte.","Straw, an old hat and glowing red eyes. Slow, but takes plenty of shots and hits hard."]},
 {id:"s4",n:["Morcego do bairro","Neighborhood bat"],hp:"6",sp:100,dm:7,xp:1,w:['Subúrbio Sombrio','Dark Suburb'],
  d:["Pequenos, rapidíssimos e sempre em trio. Fracos, mas atacam pelo escuro de todos os lados.","Tiny, super fast and always in threes. Weak, but they strike from every side in the dark."]},
 {id:"s5",n:["Vizinho de roupão","Bathrobe neighbor"],hp:"26",sp:38,dm:15,xp:3,w:['Subúrbio Sombrio','Dark Suburb'],
  d:["O vizinho que nunca dorme: roupão, bobes no cabelo e um ancinho na mão. O mais lento e resistente do bairro.","The neighbor who never sleeps: bathrobe, hair curlers and a rake in hand. The slowest and toughest in the block."]},
 {id:'b',n:['Chefão porco','Boss pig'],hp:'120+',sp:42,dm:25,xp:30,w:['Aos 1:00 e a cada 5 min','At 1:00 and every 5 min'],
  d:['O primeiro chefe. A cada minuto surge um chefe, revezando entre eles, sempre com mais vida que o anterior. Quase não se move com empurrões e buzinadas. Ao cair, solta gemas e uma maleta com upgrades de raridade variada.','The first boss. A boss shows up every minute, taking turns, always with more health than the last. It barely budges from knockback and honks. When it falls, it drops gems and a briefcase with upgrades of varying rarity.']},
 {id:'bs',n:['Semáforo Colossal','Colossal traffic light'],hp:'150+',sp:40,dm:28,xp:30,w:['Aos 2:00 e a cada 5 min','At 2:00 and every 5 min'],

 {id:'bc',n:['Cérbero de rua','Street Cerberus'],hp:'130+',sp:46,dm:26,xp:30,w:['Aos 3:00 e a cada 5 min','At 3:00 and every 5 min'],
  d:['Um vira-lata gigante de três cabeças e coleira de espinhos. Anda rosnando devagar, os olhos ficam vermelhos e ele dispara em linha reta. Desvie para o lado na hora da investida.','A giant three-headed mutt with a spiked collar. It prowls slowly, its eyes turn red and it lunges in a straight line. Sidestep when it charges.']},
 {id:'bk',n:['Caminhão de lixo faminto','Hungry garbage truck'],hp:'220+',sp:30,dm:30,xp:30,w:['Aos 4:00 e a cada 5 min','At 4:00 and every 5 min'],
  d:['Lento, enorme e muito resistente. Solta fumaça e, de tempos em tempos, abre a caçamba e despeja três ratos de esgoto atrás de si. Elimine os ratos rápido para não ser cercado.','Slow, huge and very tough. It puffs smoke and, every so often, opens its hopper and dumps three sewer rats behind it. Take the rats out fast so you do not get surrounded.']},
 {id:'bp',n:['Pombo imperial','Imperial pigeon'],hp:'100+',sp:50,dm:22,xp:30,w:['Aos 5:00 e a cada 5 min','At 5:00 and every 5 min'],
  d:['Um pombo gigante com uma mochila de entrega roubada. Voa em rasantes: acelera muito e logo depois quase para, balançando de um lado para o outro. Difícil de acertar, mas tem pouca vida.','A giant pigeon wearing a stolen delivery backpack. It flies in swoops: it speeds up a lot, then almost stops, swaying side to side. Hard to hit, but low on health.']},
 {id:'bx',n:['Brutamontes de container','Container brute'],hp:'200+',sp:34,dm:32,xp:30,w:['Distrito Industrial · aos 1:00 e a cada 5 min', 'Industrial District · 1:00 and every 5 min'],
  d:["O carrasco do galpão. Um gigante encapuzado com a barriga de porta de container enferrujada, corrente com cadeado e braçadeiras de espinhos, balançando um enorme gancho de carga. Anda pesado, se prepara por um instante e então avança. Ao cair, solta gemas e uma maleta.", "The warehouse executioner. A hooded giant with a rusty container-door belly, a padlock chain and spiked cuffs, swinging a huge cargo hook. It walks heavily, winds up for a moment, then lunges. When it falls it drops gems and a briefcase."]},
{id:"bR",n:["Caranguejo-Rei zumbi","Zombie King Crab"],hp:"190+",sp:36,dm:30,xp:30,w:["Orla da Praia · aos 1:00 e a cada 5 min","Beach Front · 1:00 and every 5 min"],
  d:["Rei da areia, com coroa e pinças gigantes. Ataque único: Pancada Sísmica — para, ergue as pinças e esmaga o chão numa explosão em área ao redor dele. Corra antes do círculo vermelho fechar. Solta gemas e uma maleta.","Sand king with a crown and giant claws. Unique attack: Seismic Slam — it stops, raises its claws and smashes the ground in a blast around itself. Run before the red circle fills. Drops gems and a briefcase."]},
{id:"bJ",n:["Água-viva voltaica","Voltaic jellyfish"],hp:"140+",sp:40,dm:24,xp:30,w:["Orla da Praia · aos 2:00 e a cada 5 min","Beach Front · 2:00 and every 5 min"],
  d:["Água-viva gigante e elétrica. Ataque único: Descarga Voltaica — dispara um leque de 5 orbes elétricos que causam dano e deixam você lento. Desvie pelos vãos.","Giant electric jellyfish. Unique attack: Voltaic Discharge — fires a fan of 5 electric orbs that deal damage and slow you down. Slip through the gaps."]},
{id:"bT",n:["Tubarão salva-vidas","Lifeguard shark"],hp:"170+",sp:46,dm:28,xp:30,w:["Orla da Praia · aos 3:00 e a cada 5 min","Beach Front · 3:00 and every 5 min"],
  d:["Tubarão humanoide azul, forte e de sunga vermelha de salva-vidas. Ataque único: Boiada — ergue a boia sobre a cabeça, avança rápido e a esmaga no chão numa área vermelha. Saia do círculo.","Strong blue humanoid shark in red lifeguard trunks. Unique attack: Buoy Slam — raises the life buoy overhead, rushes forward and smashes it down in a red area. Leave the circle."]},
{id:"bO",n:["Kraken de tinta","Ink Kraken"],hp:"220+",sp:30,dm:28,xp:30,w:["Orla da Praia · aos 4:00 e a cada 5 min","Beach Front · 4:00 and every 5 min"],
  d:["Polvo colossal que vive de tinta. Ataque único: Nuvem de Tinta — cospe poças de tinta que queimam e deixam você lento por vários segundos. Não fique parado nelas.","Colossal octopus that lives on ink. Unique attack: Ink Cloud — spits ink puddles that burn and slow you for several seconds. Don't stand in them."]},
{id:"bM",n:["Sereia zumbi","Zombie siren"],hp:"150+",sp:38,dm:24,xp:30,w:["Orla da Praia · aos 5:00 e a cada 5 min","Beach Front · 5:00 and every 5 min"],

{id:"bG",n:["Guindaste demolidor","Wrecking crane golem"],hp:"230+",sp:28,dm:32,xp:30,w:["Distrito Industrial · aos 2:00 e a cada 5 min","Industrial District · 2:00 and every 5 min"],

{id:"bF",n:["Fornalha viva","Living furnace"],hp:"240+",sp:30,dm:30,xp:30,w:["Distrito Industrial · aos 4:00 e a cada 5 min","Industrial District · 4:00 and every 5 min"],

{id:"bA",n:["Casa Assombrada","Haunted House"],hp:"260+",sp:30,dm:32,xp:30,w:["Subúrbio Sombrio · aos 1:00 e a cada 5 min","Dark Suburb · 1:00 and every 5 min"],

{id:"bI",n:["Caminhão de sorvete sinistro","Sinister ice cream truck"],hp:"240+",sp:42,dm:30,xp:30,w:["Subúrbio Sombrio · aos 2:00 e a cada 5 min","Dark Suburb · 2:00 and every 5 min"],

{id:"bE",n:["Espantalho gigante","Giant scarecrow"],hp:"250+",sp:34,dm:28,xp:30,w:["Subúrbio Sombrio · aos 3:00 e a cada 5 min","Dark Suburb · 3:00 and every 5 min"],

{id:"bZ",n:["Coveiro do bairro","Neighborhood gravedigger"],hp:"230+",sp:36,dm:28,xp:30,w:["Subúrbio Sombrio · aos 4:00 e a cada 5 min","Dark Suburb · 4:00 and every 5 min"],

{id:"bW",n:["Lobisomem alfa","Alpha werewolf"],hp:"240+",sp:48,dm:32,xp:30,w:["Subúrbio Sombrio · aos 5:00 e a cada 5 min","Dark Suburb · 5:00 and every 5 min"],
